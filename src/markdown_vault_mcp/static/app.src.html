  .preview-content pre { font-family: var(--font-mono); background: var(--panel-2); border: 1px solid var(--border-2); padding: 12px; border-radius: var(--radius-sm); overflow-x: auto; }
  .preview-content pre code { background: none; padding: 0; }
  .preview-content blockquote { border-left: 3px solid var(--edge); padding-left: 12px; color: var(--muted); margin: 8px 0; }
  .preview-content a { color: var(--accent); }
  /* Action footer */
  .preview-footer {
    display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
    margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border-2);
  }
  .edit-btn-disabled {
    display: inline-flex; align-items: center; background: var(--panel-2); color: var(--muted);
    border: 1px dashed var(--edge); padding: 6px 10px; border-radius: var(--radius-sm);
    font: 600 11px/1 var(--font-body); cursor: not-allowed; opacity: 0.7; margin-left: auto;
  }
</style>
</head>
<body>
<div class="app-container">
  <div class="app-header">
    <button class="fullscreen-btn" id="fullscreenBtn" style="display:none;"
            title="Toggle fullscreen">&#x26F6; Fullscreen</button>
  </div>
  <div class="tab-bar" id="tabBar">
    <button data-tab="context" class="active">Context</button>
    <button data-tab="graph">Graph</button>
    <button data-tab="browse">Browse</button>
    <button data-tab="note" id="note-tab-btn" class="note-tab-btn">Note</button>
  </div>
  <div class="tab-panel active" id="panel-context" data-tab="context">
    <div class="placeholder" id="context-placeholder">Select a note to view its context</div>
    <div id="context-card" style="display:none;">
      <div class="context-header">
        <div class="context-title-row">
          <div class="ctx-head-main">
            <h2 id="ctx-title">Context</h2>
            <div id="ctx-breadcrumb" class="ctx-breadcrumb"></div>
          </div>
          <div class="ctx-head-side">
            <span id="ctx-modified" class="ctx-time"></span>
            <button class="ghost-btn" id="ctx-copy-btn" title="Copy vault link">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
              <span id="ctx-copy-label">Copy link</span>
            </button>
          </div>
        </div>
        <div id="ctx-chips" class="ctx-chips"></div>
        <div class="context-actions">
          <button class="ghost-btn" id="ctx-graph-btn" title="Show in Graph">Graph</button>
          <button class="ghost-btn" id="ctx-browse-btn" title="Open in Browser">Browse</button>
          <button class="accent-btn" id="ctx-send-btn" title="Send to Claude">Send</button>
        </div>
      </div>
      <div id="ctx-frontmatter" class="context-section collapsed-section"></div>
      <div id="ctx-tags" class="context-section collapsed-section"></div>
      <div id="ctx-backlinks" class="context-section collapsed-section"></div>
      <div id="ctx-outlinks" class="context-section collapsed-section"></div>
      <div id="ctx-similar" class="context-section collapsed-section"></div>
      <div id="ctx-peers" class="context-section collapsed-section"></div>
    </div>
  </div>
  <div class="tab-panel" id="panel-graph" data-tab="graph">
    <div class="graph-toolbar" id="graph-toolbar">
      <button class="action-btn" id="graph-send-btn" title="Send graph summary to Claude">&#x1F4AC; Send</button>
      <button class="action-btn action-btn--secondary" id="graph-semantic-btn" title="Toggle semantic similarity edges">&#x223C; Semantic</button>
      <button class="action-btn action-btn--secondary" id="graph-fullscreen-btn" title="Request fullscreen for graph">&#x26F6; Expand</button>
    </div>
    <div id="graph-container" style="flex:1;position:relative;">
      <div id="graph-mini-card" class="graph-mini-card" style="display:none;"></div>
      <div class="graph-overlay" id="graph-overlay">
        <span class="graph-count" id="graph-count">0 notes</span>
        <div class="graph-zoom">
          <button id="graph-zoom-out" title="Zoom out">&#8722;</button>
          <button id="graph-zoom-in" title="Zoom in">&#43;</button>
        </div>
      </div>
    </div>
    <button class="graph-legend-chip" id="graph-legend-chip" title="Show legend">&#9432; legend</button>
    <div class="graph-legend" id="graph-legend">
      <span class="lg-item"><span class="lg-line lg-solid"></span>wikilink</span>
      <span class="lg-item"><span class="lg-line lg-dashed"></span>semantic</span>
      <span class="lg-item"><span class="lg-pill lg-focus"></span>focus note</span>
      <span class="lg-item"><span class="lg-pill lg-linked"></span>linked note</span>
      <span class="lg-item"><span class="lg-dot"></span>more (hover)</span>
    </div>
  </div>
  <div class="tab-panel" id="panel-browse" data-tab="browse">
    <div class="browser-layout">
      <div class="browser-sidebar">
        <div class="browser-search">
          <div class="search-field">
            <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="browser-search-input" aria-label="Search vault" placeholder="Search vault&#8230;" />
            <button id="browser-search-clear" style="display:none;" title="Clear search">&times;</button>
            <span class="hybrid-badge">hybrid</span>
          </div>
        </div>
        <div id="browser-tree" class="browser-tree"></div>
      </div>
    </div>
  </div>
  <div class="tab-panel" id="panel-note" data-tab="note">
    <div class="browser-preview" id="browser-preview">
      <div class="placeholder">Select a note from Browse to view it</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
// Static import required for Android webview compatibility (dynamic import()
// fails there).  SDK is vendored inline via import map (see issue #302).
import { App, applyDocumentTheme, applyHostStyleVariables, applyHostFonts }
  from "https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.4/app-with-deps";

try {

// ── Globals ──────────────────────────────────────────────────────────────
// autoResize:true (the SDK default) — the SDK observes our content size and
// reports it to the host via size-changed so the host can size the iframe. The
// app pairs this with containerDimensions-aware CSS (see applySizeMode): a
// fixed-height host frame is filled with internal scroll; a flexible/unbounded
// frame (mobile inline, sidebars) grows to content. Disabling autoResize + a
// hard height:100vh left mobile hosts unable to learn our height (#859).
const app = new App(
  { name: "Vault Explorer", version: "1.0.0" },
  {},
  { autoResize: true }
);
let currentTab = 'context';
let isFullscreen = false;
let currentPath = null; // shared active-note state across views

// ── Utilities ─────────────────────────────────────────────────────────────
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/** Extract parsed JSON from a CallToolResult ({content: [{type:'text', text:'...'}]}).
 *  Returns the parsed object, or null if no text content found.
 *  Throws Error with descriptive message on malformed JSON. */
function parseToolResult(result) {
  if (!result) return null;
  if (result.content && Array.isArray(result.content)) {
    const tb = result.content.find(c => c.type === 'text');
    if (tb) {
      try { return JSON.parse(tb.text); }
      catch (e) { throw new Error('Invalid JSON in tool result: ' + e.message); }
    }
    return null;
  }
  if (typeof result === 'string') {
    try { return JSON.parse(result); }
    catch (e) { throw new Error('Invalid JSON in tool result: ' + e.message); }
  }
  return null;
}

// ── Host-driven sizing ────────────────────────────────────────────────────
// The host reports containerDimensions (per-axis: a fixed `height`/`width`, or a
// `maxHeight`/`maxWidth` cap, or neither = unbounded) and safeAreaInsets. We
// derive a size mode from the height axis: a fixed height means the host owns
// our frame size and we fill it (internal scroll); anything else means the app
// controls its own height and the SDK's autoResize reports it so the host sizes
// the iframe to content. The CSS branches on html[data-size-mode]; the base
// (attribute unset) is the fixed/fill layout, so before the first context
// arrives there is no collapsed-content flash. The steady-state mode is chosen
// here from the reported height axis, independent of `platform`. Must receive
// the complete (merged) host context — see the call in handleHostContext. #859.
function applySizeMode(ctx) {
  const cd = ctx.containerDimensions;
  const fixedHeight = !!cd && typeof cd.height === 'number';
  document.documentElement.dataset.sizeMode = fixedHeight ? 'fixed' : 'flexible';
  const s = ctx.safeAreaInsets;
  const root = document.documentElement.style;
  root.setProperty('--safe-top', (s?.top || 0) + 'px');
  root.setProperty('--safe-right', (s?.right || 0) + 'px');
  root.setProperty('--safe-bottom', (s?.bottom || 0) + 'px');
  root.setProperty('--safe-left', (s?.left || 0) + 'px');
}

// ── Host theming ─────────────────────────────────────────────────────────
function handleHostContext(ctx) {
  if (!ctx) return;
  // onhostcontextchanged delivers a PARTIAL delta (only the changed fields);
  // the SDK has already merged it into getHostContext(). Derive size mode +
  // insets from the merged snapshot, not the delta, so an unrelated change
  // (e.g. a theme-only delta) can't reset them to their absent-field defaults.
  // Fall back to ctx if no snapshot is available yet.
  applySizeMode(app.getHostContext() || ctx);
  if (ctx.theme) {
    applyDocumentTheme(ctx.theme);
    window.dispatchEvent(new CustomEvent('vault-theme-changed', { detail: { theme: ctx.theme } }));
  }
  if (ctx.styles?.variables) applyHostStyleVariables(ctx.styles.variables);
  if (ctx.styles?.css?.fonts) applyHostFonts(ctx.styles.css.fonts);
  if (ctx.displayMode !== undefined) {
    isFullscreen = ctx.displayMode === 'fullscreen';
    fullscreenBtn.textContent = isFullscreen ? '\u2716 Exit Fullscreen' : '\u26F6 Fullscreen';
  }
}

// ── Tab navigation ───────────────────────────────────────────────────────
function switchTab(tabName) {
  currentTab = tabName;
  document.querySelectorAll('.tab-bar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tabName);
  });
  document.querySelectorAll('.tab-panel').forEach(panel => {
    panel.classList.toggle('active', panel.dataset.tab === tabName);
  });
  // Emit event for views to react
  window.dispatchEvent(new CustomEvent('vault-tab-changed', { detail: { tab: tabName } }));
}

document.getElementById('tabBar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (btn) switchTab(btn.dataset.tab);
});

// ── Cross-view navigation API ────────────────────────────────────────────
window.navigateTo = function navigateTo(view, params = {}) {
  switchTab(view);
  window.dispatchEvent(new CustomEvent('vault-navigate', {
    detail: { view, ...params }
  }));
};

// ── Display mode (fullscreen toggle) ─────────────────────────────────────
const fullscreenBtn = document.getElementById('fullscreenBtn');

function updateFullscreenButton(available) {
  fullscreenBtn.style.display = available ? 'block' : 'none';
}

fullscreenBtn.addEventListener('click', async () => {
  try {
    const mode = isFullscreen ? 'inline' : 'fullscreen';
    await app.requestDisplayMode({ mode });
  } catch (err) {
    console.warn('Display mode change failed:', err);
  }
});

// ── Toast helper ─────────────────────────────────────────────────────────
window.showToast = function showToast(message, durationMs = 2000) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), durationMs);
};

// ── Shared send-to-LLM helper ───────────────────────────────────────────
window.sendToLLM = async function sendToLLM(path, content) {
  const MAX_LEN = 4000;
  let body = content;
  if (body.length > MAX_LEN) {
    body = body.slice(0, MAX_LEN) + "\n... [truncated \u2014 use read('" + path + "') for full content]";
  }
  try {
    await app.sendMessage({
      role: 'user',
      content: { type: 'text', text: '[From Vault App] Note: ' + path + '\n\n' + body }
    });
    window.showToast('Sent to Claude');
  } catch (err) {
    window.showToast('Send failed: ' + (err.message || err));
  }
};

// ── Shared ambient context helper ────────────────────────────────────────
window.updateContext = async function updateContext(viewName, path, title, extras) {
  const lines = ['User is viewing ' + viewName + ': ' + path];
  if (title) lines.push('Title: ' + title);
  if (extras) lines.push(extras);
  try {
    await app.updateModelContext({
      content: [{ type: 'text', text: lines.join('\n') }]
    });
  } catch (err) {
    console.warn('updateModelContext failed:', err);
  }
};

// ── Expose app for views ─────────────────────────────────────────────────
window.vaultApp = app;

// ── Handler registration (before connect) ────────────────────────────────
let connected = false;
let pendingToolInput = null;

function processToolInput(args) {
  const validViews = ['context', 'graph', 'browse', 'note'];
  const view = (validViews.includes(args.view) ? args.view
    : (args.path ? 'context' : 'browse'));
  if (args.path) currentPath = args.path;
  if (view === 'note') {
    document.getElementById('note-tab-btn').classList.add('visible');
  }
  switchTab(view);
  if (args.path) {
    window.dispatchEvent(new CustomEvent('vault-navigate', {
      detail: { view, path: args.path }
    }));
  } else if (view === 'browse') {
    if (typeof window.loadBrowser === 'function') window.loadBrowser();
  }
}

app.ontoolinput = (params) => {
  const args = params?.arguments || {};
  if (connected) {
    processToolInput(args);
  } else {
    // Last-wins: only the final pre-connect input is kept. Multiple
    // ontoolinput calls before connect() are not expected in MCP semantics.
    pendingToolInput = args;
  }
};

app.ontoolresult = (result) => {
  window.dispatchEvent(new CustomEvent('vault-tool-result', { detail: result }));
};

app.ontoolcancelled = (params) => {
  console.info('Tool call cancelled:', params?.reason);
};

app.onhostcontextchanged = handleHostContext;

app.onerror = (err) => {
  console.error('MCP App error:', err);
};

app.onteardown = () => {
  return {};
};

// ── Context Card View ────────────────────────────────────────────────────
(function() {

  function escapeHtml(s) {

      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')

  }

    return i > 0 ? p.slice(0, i).split('/').pop() : '';
  }

    const s = Math.max(0, Date.now() / 1000 - unixSec);
    const day = Math.floor(s / 86400);
    if (day >= 365) return Math.floor(day / 365) + 'y ago';
    if (day >= 30) return Math.floor(day / 30) + 'mo ago';
    if (day >= 1) return day + 'd ago';
    const h = Math.floor(s / 3600);
    if (h >= 1) return h + 'h ago';
    const m = Math.floor(s / 60);
    if (m >= 1) return m + 'm ago';

  }

    el.innerHTML = '<div class="section-header"><span class="sec-label">' + label + '</span>'
      + '<span class="sec-chevron">' + ICON_CHEVRON + '</span></div>'
      + '<div class="section-body">' + bodyHtml + '</div>';
    el.classList.add('collapsed-section');
    // toggle handled by delegated listener on #panel-context
  }

(function() {

  const LABEL_ZOOM_THRESHOLD = 1.35;
  let _zoomedIn = false;
  let _hoveredId = null;

  // Folder-based node colors — chosen to stand out on both light and dark backgrounds
  const _FOLDER_COLORS = [
    '#6366f1', // indigo
    '#0ea5e9', // sky
    '#10b981', // emerald
    '#f59e0b', // amber
    '#ef4444', // red
    '#8b5cf6', // violet
    '#06b6d4', // cyan
    '#f97316', // orange
  ];
  function _folderColor(folder) {
    if (!folder) return _FOLDER_COLORS[0];
    let h = 0;
    for (let i = 0; i < folder.length; i++) h = (h * 31 + folder.charCodeAt(i)) & 0x7fffffff;
    return _FOLDER_COLORS[h % _FOLDER_COLORS.length];
  }

  // Paper palette for edges and canvas chrome, read from CSS vars so the graph
  // re-themes when the host flips theme (see refreshColors / vault-theme-changed).
  function getColors() {
    // Resolve each token to a concrete rgb() string via a probe element.
    // getComputedStyle(documentElement).getPropertyValue('--panel') can return
    // the literal "var(--color-background-primary)" when a Paper token is an
    // indirection (styles.css maps --panel/--ink/... onto host --color-* tokens).
    // Modern Chromium resolves that, but older Chromium (Claude Desktop's
    // Electron) returns the unresolved string, which canvas fillStyle can't
    // parse -> vis-network paints black. Assigning `var(...)` to a real
    // property (color) forces full var() substitution in every engine and
    // still honors host overrides + theme flips.
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none';
    document.body.appendChild(probe);
    const v = (name, fallback) => {
      probe.style.color = `var(${name}, ${fallback})`;
      return getComputedStyle(probe).color; // always a resolved rgb(...)
    };
    const c = {
      panel:      v('--panel', '#fbf8f1'),
      panel2:     v('--panel-2', '#f2ecdf'),
      ink:        v('--ink', '#2a2620'),
      ink2:       v('--ink-2', '#5c5446'),
      muted:      v('--muted', '#928975'),
      edge:       v('--edge', '#d3c7ad'),
      accent:     v('--accent', '#b25a35'),
      accentInk:  v('--accent-ink', '#ffffff'),
      accentSoft: v('--accent-soft', '#f3e4d8'),
      border:     v('--border', '#e4dbc9'),

  // Edge styling: solid --edge for link edges (thinner + lower opacity when the

  function edgeStyle(type, depthMax, c) {

        nodesDS.add({
          id: n.id, label: n.label,
          title: n.label + (n.folder ? ' (' + n.folder + ')' : '') + (bc > 0 ? ' \u2014 ' + bc + ' backlinks' : ''),
          _label: n.label, _folder: n.folder, _group: n.group,
          _folderColor: n.group === 'orphan' ? '#94a3b8' : _folderColor(n.folder),
          _backlinks: bc,

      const edgeId = isSemantic
        ? 'sem:' + [e.from, e.to].sort().join('<>')

          id: edgeId, from: e.from, to: e.to,
          color: es.color, title: e.type, dashes: es.dashes, width: es.width,
          arrows: isSemantic ? '' : { to: { enabled: true, scaleFactor: 0.5 } },

  // BFS distance-from-focus over the accumulated edge set. Unreachable nodes are

  function computeDepths() {

    const adj = new Map();
    for (const e of edgesDS.get()) {
      if (!adj.has(e.from)) adj.set(e.from, []);
      if (!adj.has(e.to)) adj.set(e.to, []);
      adj.get(e.from).push(e.to);
      adj.get(e.to).push(e.from);

    const queue = [graphCenterPath];
    depths.set(graphCenterPath, 0);
    while (queue.length) {
      const id = queue.shift();
      const d = depths.get(id);
      for (const nb of adj.get(id) || []) {

                font: { color: c.ink2, size: 12 }, label: n._label };

  // Fullscreen for graph
  document.getElementById('graph-fullscreen-btn').addEventListener('click', async () => {
    try { await app.requestDisplayMode({ mode: 'fullscreen' }); } catch (e) { console.warn(e); }
  });

  // Semantic toggle: reload graph with/without semantic edges
  document.getElementById('graph-semantic-btn').addEventListener('click', () => {
    semanticEnabled = !semanticEnabled;
    const btn = document.getElementById('graph-semantic-btn');
    btn.classList.toggle('active', semanticEnabled);
    // Reload current graph with updated setting
    if (graphCenterPath) loadGraph(graphCenterPath);
  });

  // Listen for navigation events
  window.addEventListener('vault-navigate', (e) => {
    if (e.detail.view === 'graph') {
      loadGraph(e.detail.path || null);
    }
  });

  // Sync to shared currentPath when switching to this tab
  window.addEventListener('vault-tab-changed', (e) => {
    if (e.detail.tab === 'graph') {
      if (currentPath && currentPath !== graphCenterPath) {
        loadGraph(currentPath);
      } else if (!nodesDS || nodesDS.length === 0) {
        loadGraph(graphCenterPath);
      }
    }
  });

  window.loadGraph = loadGraph;
})();
// ── Vault Browser View ──────────────────────────────────────────────────
(function() {
  function escHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  const ICON_CHEVRON = '<svg class="tree-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  const ICON_FILE = '<svg class="tree-ico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>';
  const ICON_IMAGE = '<svg class="tree-ico" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l5-4 4 3 3-2 2 2"/></svg>';

  let treeDataCache = {};
  let isSearchMode = false;

  const treeEl = document.getElementById('browser-tree');
  const searchInput = document.getElementById('browser-search-input');
  const searchClear = document.getElementById('browser-search-clear');

  async function loadFolder(folder) {
    const key = folder || '__root__';
    if (treeDataCache[key]) return treeDataCache[key];
    try {
      const result = await app.callServerTool({ name: 'app___vault_list', arguments: { folder: folder || null } });
      const data = parseToolResult(result);
      if (!data) return { folders: [], notes: [] };
      treeDataCache[key] = data;
      return data;
    } catch (err) {
      console.warn('Failed to load folder:', err);
      return { folders: [], notes: [] };
    }
  }

  function renderTree(data, parentEl) {
    parentEl.innerHTML = '';
    // Folders
    for (const f of data.folders) {
      const name = f.includes('/') ? f.split('/').pop() : f;
      const folderDiv = document.createElement('div');
      folderDiv.className = 'tree-folder';
      folderDiv.innerHTML = ICON_CHEVRON + '<span class="tree-label">' + escHtml(name) + '</span>';
      folderDiv.dataset.folder = f;
      parentEl.appendChild(folderDiv);

      const childrenDiv = document.createElement('div');
      childrenDiv.className = 'tree-children';
      parentEl.appendChild(childrenDiv);

      folderDiv.addEventListener('click', async () => {
        const isExpanded = folderDiv.classList.contains('expanded');
        if (isExpanded) {
          folderDiv.classList.remove('expanded');
        } else {
          folderDiv.classList.add('expanded');
          if (childrenDiv.children.length === 0) {
            const subData = await loadFolder(f);
            renderTree(subData, childrenDiv);
          }
        }
      });
    }
    // Notes
    for (const n of data.notes) {
      const noteDiv = document.createElement('div');
      noteDiv.className = 'tree-note';
      const icon = n.kind === 'attachment' ? ICON_IMAGE : ICON_FILE;
      noteDiv.innerHTML = icon + '<span class="tree-label">' + escHtml(n.title || n.path) + '</span>';
      noteDiv.title = n.path;
      noteDiv.dataset.path = n.path;
      noteDiv.addEventListener('click', () => window.loadPreview(n.path));
      parentEl.appendChild(noteDiv);
    }
  }

  async function loadRootTree() {
    treeDataCache = {};
    const data = await loadFolder(null);
    renderTree(data, treeEl);
  }

  // Search
  let searchTimeout = null;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    const q = searchInput.value.trim();
    if (!q) { exitSearch(); return; }
    searchTimeout = setTimeout(() => doSearch(q), 300);
  });

  async function doSearch(query) {
    isSearchMode = true;
    searchClear.style.display = '';
    try {
      const result = await app.callServerTool({
        name: 'app___vault_search', arguments: { query, mode: 'hybrid', limit: 20 }
      });
      const data = parseToolResult(result) || [];
      treeEl.innerHTML = '';
      for (const r of data) {
        const div = document.createElement('div');
        div.className = 'search-result';
        div.innerHTML = '<div class="search-result-title">' + escHtml(r.title || r.path) + '</div>'
          + '<div class="search-result-snippet">' + escHtml(r.snippet || '') + '</div>';
        div.addEventListener('click', () => window.loadPreview(r.path));
        treeEl.appendChild(div);
      }
      if (data.length === 0) {
        treeEl.innerHTML = '<div class="placeholder" style="padding:12px">No results</div>';
      }
    } catch (err) {
      treeEl.innerHTML = '<div class="placeholder" style="padding:12px">Search error</div>';
    }
  }

  function exitSearch() {
    isSearchMode = false;
    searchClear.style.display = 'none';
    searchInput.value = '';
    loadRootTree();
  }

  searchClear.addEventListener('click', exitSearch);

  // Auto-load when browse tab is selected
  window.addEventListener('vault-tab-changed', (e) => {
    if (e.detail.tab === 'browse' && treeEl.children.length === 0 && !isSearchMode) {
      loadRootTree();
    }
  });

  window.loadBrowser = loadRootTree;
})();
// ── Note Preview View ────────────────────────────────────────────────────
(function() {
  function escHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  const ICON_LIST = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>';
  const ICON_COPY = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  const ICON_LINK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
  const CHEVRON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  const PROPS_SHOWN = 3;
  const TAGS_SHOWN = 4;

  let currentPreviewPath = null;
  let currentPreviewData = null;

  const previewEl = document.getElementById('browser-preview');

  // Strip a leading YAML frontmatter block so it isn't rendered twice: the
  // frontmatter already shows in the properties panel, and vault_read's
  // `content` is the whole file including frontmatter. The server's parser
  // (python-frontmatter) fences on `^-{3,}\s*$`; this deliberately narrower
  // `-{3,}[ \t]*` covers the realistic cases (`----` and `--- ` fences) so
  // they strip too, while never over-stripping real body content.
  function stripFrontmatter(text) {
    return String(text || '').replace(/^﻿?-{3,}[ \t]*\r?\n[\s\S]*?\r?\n-{3,}[ \t]*\r?\n?/, '');
  }

  function normalizeTags(fm) {
    const t = fm && fm.tags;
    if (Array.isArray(t)) return t.map(String);
    if (typeof t === 'string') return t.split(/[,\s]+/).filter(Boolean);
    return [];
  }

  function propEntries(fm) {
    if (!fm) return [];
    return Object.entries(fm).filter(([k]) => k !== 'tags');
  }

  function renderProps(fm) {
    const entries = propEntries(fm);
    if (entries.length === 0) return '';
    const rows = entries.map(([k, v], i) => {
      const val = typeof v === 'object' ? JSON.stringify(v) : String(v);
      const extra = i >= PROPS_SHOWN ? ' prop-extra' : '';
      return '<div class="prop-row' + extra + '"><span class="prop-key">' + escHtml(k)
        + '</span><span class="prop-val">' + escHtml(val) + '</span></div>';
    }).join('');
    const more = entries.length - PROPS_SHOWN;
    const toggle = more > 0
      ? '<button class="prop-toggle" id="preview-props-toggle">' + CHEVRON
        + '<span id="preview-props-toggle-label">Show ' + more + ' more properties</span></button>'
      : '';
    return '<div class="preview-props collapsed" id="preview-props">' + rows + toggle + '</div>';
  }

  function renderTags(fm) {
    const tags = normalizeTags(fm);
    if (tags.length === 0) return '';
    const chips = tags.map((t, i) =>
      '<span class="tag-pill' + (i >= TAGS_SHOWN ? ' tag-extra' : '') + '">#' + escHtml(t) + '</span>'
    ).join('');
    const more = tags.length - TAGS_SHOWN;
    const toggle = more > 0
      ? '<button class="tag-toggle" id="preview-tags-toggle">+' + more + ' more</button>'
      : '';
    return '<div class="preview-tags collapsed" id="preview-tags">' + chips + toggle + '</div>';
  }

  function slugify(text, used) {
    let base = String(text).toLowerCase().trim().replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
    let slug = base, n = 1;
    while (used.has(slug)) { slug = base + '-' + (++n); }
    used.add(slug);
    return slug;
  }

  // Assign ids to rendered headings and return [{label, id, level}] for the ToC.
  function buildToc(contentEl) {
    const used = new Set();
    const items = [];
    contentEl.querySelectorAll('h1, h2, h3').forEach(h => {
      const id = 'h-' + slugify(h.textContent || 'section', used);
      h.id = id;
      h.style.scrollMarginTop = '12px';
      items.push({ id, label: h.textContent || '', level: Number(h.tagName[1]) });
    });
    return items;
  }

  async function copyToClipboard(text, labelEl, doneText, restoreText) {
    try {
      await navigator.clipboard.writeText(text);
      if (labelEl) {
        labelEl.textContent = doneText;
        setTimeout(() => { labelEl.textContent = restoreText; }, 1500);
      }
    } catch (err) {
      console.warn('clipboard write failed', err);
      window.showToast('Copy failed');
    }
  }

  async function loadPreview(path, { switchToNote = true } = {}) {
    currentPreviewPath = path;
    currentPath = path; // sync shared state
    // Show the Note tab button; switch to it unless caller opts out
    document.getElementById('note-tab-btn').classList.add('visible');
    if (switchToNote) switchTab('note');
    // Highlight active note in the browser tree
    document.getElementById('browser-tree')?.querySelectorAll('.tree-note').forEach(el => {
      el.classList.toggle('active', el.dataset.path === path);
    });

    try {
      const result = await app.callServerTool({ name: 'app___vault_read', arguments: { path } });
      const data = parseToolResult(result);
      if (!data) { previewEl.innerHTML = '<div class="placeholder">Note not found</div>'; return; }
      currentPreviewData = data;

      // Rendered markdown body (frontmatter stripped so it shows only in props).
      const body = stripFrontmatter(data.content);
      let rendered;
      if (typeof marked !== 'undefined') {
        rendered = marked.parse(body);
      } else {
        rendered = '<pre>' + escHtml(body) + '</pre>';
      }
      if (typeof DOMPurify !== 'undefined') {
        rendered = DOMPurify.sanitize(rendered);
      }

      let html = '<div class="preview">';
      html += '<div class="preview-header">';
      html += '<div class="preview-head-main"><h1 class="preview-title">' + escHtml(data.title || path) + '</h1>'
        + '<div class="preview-path">' + escHtml(data.path || path) + '</div></div>';
      html += '<div class="preview-toc-wrap">'
        + '<button class="ghost-btn" id="preview-toc-btn" title="Contents">' + ICON_LIST + 'Contents</button>'
        + '<div class="preview-toc" id="preview-toc" hidden></div>'
        + '</div>';
      html += '</div>';
      html += renderProps(data.frontmatter);
      html += renderTags(data.frontmatter);
      html += '<div class="preview-content">' + rendered + '</div>';
      html += '<div class="preview-footer">';
      html += '<button class="accent-btn" id="preview-copy-md">' + ICON_COPY + '<span id="preview-copy-md-label">Copy markdown</span></button>';
      html += '<button class="ghost-btn" id="preview-copy-link">' + ICON_LINK + '<span id="preview-copy-link-label">Copy vault link</span></button>';
      html += '<button class="ghost-btn" id="preview-send-btn" title="Send to Claude">Send</button>';
      html += '<button class="ghost-btn" id="preview-browse-btn" title="Back to Browse">← Browse</button>';
      html += '<button class="ghost-btn" id="preview-ctx-btn" title="Show Context">Context</button>';
      html += '<button class="ghost-btn" id="preview-graph-btn" title="Show in Graph">Graph</button>';
      html += '<button class="edit-btn-disabled" title="Coming soon" disabled>Edit</button>';
      html += '</div></div>';

      previewEl.innerHTML = html;

      // Build the ToC from the rendered headings.
      const toc = buildToc(previewEl.querySelector('.preview-content'));
      const tocEl = document.getElementById('preview-toc');
      if (toc.length > 0) {
        tocEl.innerHTML = '<div class="toc-head">On this page</div>'
          + toc.map(it => '<a class="toc-item toc-l' + it.level + '" href="#' + it.id + '">' + escHtml(it.label) + '</a>').join('');
      } else {
        document.getElementById('preview-toc-btn').style.display = 'none';
      }

      // Contents popover
      const tocBtn = document.getElementById('preview-toc-btn');
      tocBtn?.addEventListener('click', (e) => { e.stopPropagation(); tocEl.hidden = !tocEl.hidden; });
      tocEl.addEventListener('click', (e) => {
        const link = e.target.closest('a.toc-item');
        if (link) {
          e.preventDefault();
          document.getElementById(link.getAttribute('href').slice(1))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          tocEl.hidden = true;
        }
      });

      // Collapsible properties + tags
      document.getElementById('preview-props-toggle')?.addEventListener('click', () => {
        const box = document.getElementById('preview-props');
        const open = box.classList.toggle('collapsed') === false;
        const label = document.getElementById('preview-props-toggle-label');
        if (label) label.textContent = open ? 'Show less' : ('Show ' + (propEntries(data.frontmatter).length - PROPS_SHOWN) + ' more properties');
      });
      document.getElementById('preview-tags-toggle')?.addEventListener('click', () => {
        const box = document.getElementById('preview-tags');
        const open = box.classList.toggle('collapsed') === false;
        const btn = document.getElementById('preview-tags-toggle');
        btn.textContent = open ? 'Show less' : ('+' + (normalizeTags(data.frontmatter).length - TAGS_SHOWN) + ' more');
      });

      // Copy actions
      document.getElementById('preview-copy-md')?.addEventListener('click', () => {
        copyToClipboard(data.content || '', document.getElementById('preview-copy-md-label'), 'Copied ✓', 'Copy markdown');
      });
      document.getElementById('preview-copy-link')?.addEventListener('click', () => {
        copyToClipboard(data.path || path, document.getElementById('preview-copy-link-label'), 'Copied ✓', 'Copy vault link');
      });

      // Preserved actions
      document.getElementById('preview-send-btn')?.addEventListener('click', () => {
        window.sendToLLM(data.path, data.content || '');
      });
      document.getElementById('preview-browse-btn')?.addEventListener('click', () => { switchTab('browse'); });
      document.getElementById('preview-ctx-btn')?.addEventListener('click', () => {
        window.navigateTo('context', { path: data.path });
      });
      document.getElementById('preview-graph-btn')?.addEventListener('click', () => {
        window.navigateTo('graph', { path: data.path });
      });

      window.updateContext('browser', path, data.title);
    } catch (err) {
      console.error('note preview render failed for %s', path, err);
      const errDiv = document.createElement('div');
      errDiv.className = 'placeholder';
      errDiv.textContent = 'Error: ' + (err.message || err);
      previewEl.innerHTML = '';
      previewEl.appendChild(errDiv);
    }
  }

  // Close the Contents popover on any outside click.
  document.addEventListener('click', (e) => {
    const toc = document.getElementById('preview-toc');
    if (toc && !toc.hidden && !e.target.closest('.preview-toc-wrap')) toc.hidden = true;
  });

  // Close the popover when leaving the Note tab.
  window.addEventListener('vault-tab-changed', () => {
    const toc = document.getElementById('preview-toc');
    if (toc) toc.hidden = true;
  });

  // Listen for navigation events
  window.addEventListener('vault-navigate', (e) => {
    if ((e.detail.view === 'browse' || e.detail.view === 'note') && e.detail.path) {
      // When navigating to browse with a path, load the preview but stay on browse
      const switchToNote = e.detail.view !== 'browse';
      loadPreview(e.detail.path, { switchToNote });
    }
  });

  window.loadPreview = loadPreview;
})();
// ── Connect ──────────────────────────────────────────────────────────────
await app.connect();
connected = true;
const hostContext = app.getHostContext();
if (hostContext) handleHostContext(hostContext);

const fullscreenAvailable = hostContext?.availableDisplayModes?.includes('fullscreen') === true;
updateFullscreenButton(fullscreenAvailable);
// Auto-expand on first load — a complex multi-view app benefits from more space
// on desktop/web. NOT on mobile: there fullscreen is the whole screen with no
// working return path on some hosts (leaving it can tear the app down), and the
// content-driven inline layout is the right default (#859). platform may be
// undefined on older hosts — treat that as non-mobile so desktop is unchanged.
if (fullscreenAvailable && !isFullscreen && hostContext?.platform !== 'mobile') {
  app.requestDisplayMode({ mode: 'fullscreen' }).catch(() => {});
}

// Process any tool input received during connection handshake.
// If none arrived (host did not send ontoolinput), default to browse view so
// the app shows data without requiring the LLM to pass explicit arguments.
if (pendingToolInput) {
  processToolInput(pendingToolInput);
  pendingToolInput = null;
} else {
  switchTab('browse');
  if (typeof window.loadBrowser === 'function') window.loadBrowser();
}

console.log('Vault Explorer connected');

} catch (err) {
  console.error('Vault Explorer error:', err);
  const container = document.querySelector('.app-container');
  const el = document.createElement('div');
  el.style.cssText = 'padding:24px;text-align:center;color:var(--ink-2);';
  const h = document.createElement('h2');
  h.textContent = 'Vault Explorer';
  const p1 = document.createElement('p');
  p1.textContent = 'This app requires a compatible MCP client with ext-apps SDK support.';
  const p2 = document.createElement('p');
  p2.style.cssText = 'font-size:12px;margin-top:8px;';
  p2.textContent = 'Error: ' + (err.message || err);
  el.append(h, p1, p2);
  (container || document.body).replaceChildren(el);
}
</script>
</body>
