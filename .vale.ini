# Vale prose linter — https://vale.sh
#
# Lints the user-facing docs site (`docs/**`) plus `README.md` for prose
# issues. Internal dev docs (`docs/design/**`, `docs/decisions/**`,
# `docs/superpowers/**`) are excluded by the pre-commit hook (`exclude:`
# pattern) and the CI step (`--glob='!docs/{superpowers,design,decisions}/**'`),
# mirroring the mkdocs `exclude_docs:` block; Vale itself has no notion of
# "skip this subtree", so the exclusion lives at the invocation site. See the
# Documentation Conventions section in CLAUDE.md.
#
# `MinAlertLevel = error` governs both what Vale prints AND its exit code —
# warnings and suggestions are advisory (visible in `vale --minAlertLevel=
# warning` runs) but do not fail CI / pre-commit. Tune individual rules
# (e.g. disable a noisy one) via per-rule overrides:
#
#     [*.md]
#     Google.Spelling = NO
#
# See https://vale.sh/docs/keys/format for the full key reference and
# https://vale.sh/docs/topics/styles for rule-tuning syntax.
#
# Project-specific accepted vocabulary lives at
# `.vale/styles/config/vocabularies/Base/accept.txt` (one term per line,
# matched case-insensitively). The `Vocab = Base` line below activates it.
# The config/ subtree is preserved across `vale sync`; see .gitignore for
# the include/exclude rules.

StylesPath = .vale/styles
MinAlertLevel = error
Vocab = Base

# `Vale` is a built-in style, always available without listing here.
# `Google`, `proselint`, `write-good` are upstream packages fetched by
# `vale sync` from Vale's package registry — listed by name without an
# `@version` suffix means they resolve to the latest registry release on
# each sync. Intentional: keeps style rules current. To pin for
# reproducibility, append a version (e.g. `Google@1.0.0`).
# `ai-tells` (https://github.com/tbhb/vale-ai-tells) catches common
# LLM-prose tells; pinned to a specific release URL since it is not in
# Vale's package index. NOTE: this file is `_skip_if_exists` — after the
# first `copier copy`, copier updates no longer propagate URL changes here.
# If tbhb/vale-ai-tells renames or removes the pinned release, `vale sync`
# will fail permanently for this project. Periodically check
# https://github.com/tbhb/vale-ai-tells/releases and bump the URL manually.
#
# THIS LINE IS THE SOURCE OF TRUTH for which packs exist, and three places
# restate it by hand — change it and all three change with it:
#   1. `BasedOnStyles` below. A style named there that `Packages` does not
#      fetch makes vale exit 2 with `E100 [loadStyles]`.
#   2. the `Cache Vale style packages` `path:` list in
#      `.github/workflows/ci.yml`.
#   3. the `for p in` list in `.pre-commit-config.yaml`'s `vale-sync` hook.
#      A pack missing there is never seen as missing, so the hook never
#      syncs and the `vale` hook right after it fails on packaging.
# In the TEMPLATE repo, CI asserts these three plus its own workflow's cache
# list against this line, so drift there fails loudly. This file is
# `_skip_if_exists` (see above), so your copy is yours: nothing in this
# project's CI checks that the three above still match a pack you add here.
Packages = Google, proselint, write-good, https://github.com/tbhb/vale-ai-tells/releases/download/v1.9.0/ai-tells.zip

[*.md]
BasedOnStyles = Vale, Google, proselint, write-good, ai-tells

# Vale.Terms enforces strict casing of every accept.txt entry — useful for
# product names (e.g. "GitHub" not "Github") but overzealous for generic
# tech vocab where sentence-start, heading-start, and mid-sentence usages
# legitimately appear with different casing. Vale.Spelling still accepts
# all entries case-insensitively; we just don't enforce one canonical form.
Vale.Terms = NO
