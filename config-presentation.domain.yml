# Domain presentation layer — YOURS to edit.  Preserved across copier update.
#
# Domain env vars are discovered automatically from your ProjectConfig's
# CONFIG-FIELDS block, using each field's `metadata={"help": ..., "tags": ...}`.
# Declare a var here only when it is read somewhere the scan cannot see it —
# a deprecated alias no longer read inside ProjectConfig.from_env, or a var
# read outside ProjectConfig.from_env entirely.
#
# Same shape as the template-owned config-presentation.yml.  `{PREFIX}` is
# substituted with your env_prefix.
#
# A var's `default:` key controls whether it renders required, the same way
# a dataclass field does: omit `default:` entirely to mark the var required,
# or give it `default: null` (or a real default) to mark it optional.
vars:
  # Bare (unprefixed) embedding-provider conventions, read via os.environ
  # inside ProjectConfig.from_env — invisible to the prefixed AST scan.
  - name: "OLLAMA_HOST"
    type_name: "str"
    default: "http://localhost:11434"
    help: >-
      Ollama server URL for the ollama embedding provider. Bare (not
      {PREFIX}_-prefixed), matching the Ollama ecosystem convention.
    tags: [embeddings]
    wizard: {group: Embeddings}

  - name: "OPENAI_API_KEY"
    type_name: "str"
    default: null
    help: >-
      OpenAI API key for the openai embedding provider, and the fallback key
      for the summarize tool when {PREFIX}_SUMMARIZE_OPENAI_API_KEY is unset.
      Bare (not {PREFIX}_-prefixed), matching the OpenAI ecosystem convention.
    tags: [embeddings]
    wizard: {group: Embeddings, secret: true}

  - name: "VOYAGE_API_KEY"
    type_name: "str"
    default: null
    help: >-
      Voyage AI API key for the voyage embedding provider. Bare (not
      {PREFIX}_-prefixed), matching the OPENAI_API_KEY / OLLAMA_HOST
      convention. Setting it never auto-selects the provider; choose it
      explicitly with {PREFIX}_EMBEDDING_PROVIDER=voyage.
    tags: [embeddings]
    wizard: {group: Embeddings, secret: true}

  - name: "OPENAI_BASE_URL"
    type_name: "str"
    default: null
    help: >-
      Bare fallback for {PREFIX}_OPENAI_BASE_URL (embeddings). For the
      summarize tool it only routes traffic when an API key already enables
      the feature; it never enables summarize by itself.
    tags: [embeddings]
    # No wizard question: the prefixed {PREFIX}_OPENAI_BASE_URL is the
    # offered control and the two would collide on one question id.
    wizard: {control: none}

  - name: "OPENAI_EMBEDDING_MODEL"
    type_name: "str"
    default: null
    help: >-
      Bare fallback for {PREFIX}_OPENAI_EMBEDDING_MODEL.
    tags: [embeddings]
    # No wizard question — same id-collision rationale as OPENAI_BASE_URL.
    wizard: {control: none}

  # MCP-layer timeouts, read via os.environ in the server layer (outside
  # ProjectConfig.from_env), so the AST scan cannot see them.
  - name: "{PREFIX}_BUILD_TIMEOUT_S"
    type_name: "float"
    default: 60
    help: >-
      Maximum seconds an index-backed tool or resource waits for the FTS
      index to become queryable during a cold-start background build before
      raising IndexUnavailableError(reason="timeout"). Increase for
      large vaults.
    tags: [timeouts]
    wizard: {group: Timeouts}

  - name: "{PREFIX}_DRAIN_TIMEOUT_S"
    type_name: "float"
    default: 60
    help: >-
      Maximum seconds an index-querying read tool waits for the IndexWriter
      to drain when called with wait_for_pending_writes=true. On timeout the
      tool answers from the current index and reports index_stale=true in
      the response _meta.
    tags: [timeouts]
    wizard: {group: Timeouts}

# Extra wizard questions specific to this project.
wizard_routing: []

# Extra wizard guards specific to this project.
wizard_guards: []

# Claude Desktop mcpb install screen — this project's curation of the
# template-declared `packaging/mcpb/manifest.json.in` channel (#1041).
# Field ids match the pre-generation hand-maintained screen so values
# Claude Desktop already stored for existing installs stay attached.
# Deliberately reduced from the old 26-field screen: HTTP-auth fields
# (bearer/OIDC) cannot apply to a stdio bundle, and operator tuning
# (state/index/embeddings paths, cache dirs, push-delay) stays reachable
# via env vars per docs/configuration.md. One line per field to adjust.
files:
  packaging/mcpb/manifest.json.in:
    # Anchored so the Claude Code plugin screen below reuses the identical
    # field set — one curation, two install channels (#1040/#1041).
    fields: &vault_screen_fields
      "{PREFIX}_SOURCE_DIR":
        id: source_dir
        title: "Vault directory"
        type: directory
        required: true
        default: "${DOCUMENTS}/Vault"
      "{PREFIX}_READ_ONLY":
        id: read_only
        title: "Read-only mode"
        default: false
      "{PREFIX}_EXCLUDE":
        id: exclude_patterns
        title: "Exclude patterns"
        # The server itself applies no exclude fallback (unset → scan
        # everything), so the install screens carry the safe default the
        # old hand-written manifests baked into their shell fallbacks.
        default: ".obsidian/**,.trash/**,.git/**"
      "{PREFIX}_EMBEDDING_PROVIDER":
        id: embedding_provider
        title: "Embedding provider"
        description: "Semantic-search backend: fastembed, ollama, openai, or voyage. Leave empty to disable embeddings."
      OLLAMA_HOST:
        id: ollama_host
        title: "Ollama host"
      "{PREFIX}_OLLAMA_MODEL":
        id: ollama_model
        title: "Ollama embedding model"
      "{PREFIX}_FASTEMBED_MODEL":
        id: fastembed_model
        title: "FastEmbed model"
      OPENAI_API_KEY:
        id: openai_api_key
        title: "OpenAI API key"
        sensitive: true
      OPENAI_BASE_URL:
        id: openai_base_url
        title: "OpenAI base URL"
      OPENAI_EMBEDDING_MODEL:
        id: openai_embedding_model
        title: "OpenAI embedding model"
      VOYAGE_API_KEY:
        id: voyage_api_key
        title: "Voyage API key"
        sensitive: true
      "{PREFIX}_VOYAGE_MODEL":
        id: voyage_model
        title: "Voyage embedding model"
      "{PREFIX}_GIT_REPO_URL":
        id: git_repo_url
        title: "Git sync repository URL"
      "{PREFIX}_GIT_TOKEN":
        id: git_token
        title: "Git access token"
        sensitive: true

  # Claude Code plugin install screen (#1040): the same curated fields
  # drive plugin.json's userConfig object and .mcp.json's env wiring —
  # `fields_from` keeps the pair drift-proof across the two files. The
  # template's mcpb baseline (server name, log level) is added explicitly
  # here since this channel's entries are domain-declared wholesale.
  .claude-plugin/plugin/.claude-plugin/plugin.json:
    kind: claude-plugin-user-config
    fields:
      <<: *vault_screen_fields
      # Overrides the anchored spec: ${DOCUMENTS} is an mcpb-host
      # placeholder Claude Code does not substitute, so the plugin's
      # required directory picker ships without a default. The explicit
      # null keeps the generator from falling back to the config field's
      # own Path default (template#341).
      "{PREFIX}_SOURCE_DIR":
        id: source_dir
        title: "Vault directory"
        type: directory
        required: true
        default: null
      "{PREFIX}_SERVER_NAME":
        id: server_name
        title: "Server name"
      FASTMCP_LOG_LEVEL:
        id: log_level
        title: "Log level"

  .claude-plugin/plugin/.mcp.json:
    kind: claude-plugin-env
    fields_from: .claude-plugin/plugin/.claude-plugin/plugin.json
