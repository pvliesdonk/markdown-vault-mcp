site_name: markdown-vault-mcp
site_url: https://pvliesdonk.github.io/markdown-vault-mcp/
site_description: "Generic markdown vault MCP with hybrid search"
repo_url: https://github.com/pvliesdonk/markdown-vault-mcp
repo_name: pvliesdonk/markdown-vault-mcp
edit_uri: edit/main/docs/

# Internal dev docs live under docs/ but are NOT part of the published site.
# Keep this set in lockstep with the Vale exclusion (ci.yml's `glob:` input +
# the pre-commit `- id: vale` exclude); see the Documentation Conventions
# section in AGENTS.md. superpowers/ is also gitignored.
exclude_docs: |
  design/**
  decisions/**
  releases/next.md
  superpowers/**

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: latest

extra_javascript:
  - path: javascripts/config-wizard/wizard.js
    type: module

extra_css:
  - stylesheets/config-wizard.css

plugins:
  - search
  # Keeps a moved page's old URL working. The entries above the project
  # block are the template's own moves; a project that moves one of its
  # pages adds `old-page.md: new-page.md` inside the block.
  - redirects:
      redirect_maps:
        configuration.md: reference/configuration.md
        configuration-generator.md: reference/configuration-generator.md
        tools/index.md: reference/tools/index.md
        prompts.md: reference/prompts.md
        guides/security-model.md: security-model.md
        installation.md: get-started/installation.md
        deployment/claude-desktop.md: get-started/claude-desktop.md
        deployment/docker.md: deploy/docker.md
        guides/authentication.md: deploy/authentication.md
        deployment/oidc.md: deploy/oidc.md
        deployment/release-process.md: contribute/release-process.md
        deployment/template-updates.md: contribute/template-updates.md
        deployment/repository-protection.md: contribute/repository-protection.md
        deployment/integration-branches.md: contribute/integration-branches.md
        # PROJECT-REDIRECTS-START — this project's moved pages; kept across copier update
        guides/claude-desktop.md: get-started/claude-desktop.md
        guides/claude-code-plugin.md: get-started/claude-code.md
        guides/docker.md: deploy/docker.md
        deployment/index.md: deploy/index.md
        deployment/systemd.md: deploy/systemd.md
        guides/oidc-providers.md: deploy/oidc-providers.md
        guides/mcp-apps.md: deploy/mcp-apps.md
        guides/transfer-links.md: deploy/transfer-links.md
        guides/index.md: use/index.md
        guides/embeddings.md: use/embeddings.md
        guides/git-integration.md: use/git-integration.md
        guides/obsidian-everywhere.md: use/obsidian-everywhere.md
        guides/okf.md: use/okf.md
        guides/para.md: use/para.md
        guides/research-workflows.md: use/research-workflows.md
        guides/zettelkasten.md: use/zettelkasten.md
        api/config.md: reference/api/config.md
        api/exceptions.md: reference/api/exceptions.md
        api/facets.md: reference/api/facets.md
        api/git.md: reference/api/git.md
        api/providers.md: reference/api/providers.md
        api/types.md: reference/api/types.md
        api/vault.md: reference/api/vault.md
        cli.md: reference/cli.md
        resources.md: reference/resources.md
        # PROJECT-REDIRECTS-END
  # Generates llms.txt + llms-full.txt for the README badge.
  # The sections are filled from `nav:` at build time by
  # scripts/llmstxt_sections_hook.py (registered under `hooks:`): one section
  # per top-level nav entry, pages outside the nav joining the section of a
  # nav page in their directory, descriptions from each page's `description:`
  # front matter. Nothing to keep in step by hand.
  - llmstxt:
      full_output: llms-full.txt
      sections: {}
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

hooks:
  - scripts/llmstxt_sections_hook.py

nav:
  - Overview: index.md
  - Security model: security-model.md
  - Get started:
      - Overview: get-started/index.md
      - Claude Desktop: get-started/claude-desktop.md
      - Claude Code: get-started/claude-code.md
      - A remote server: get-started/http-client.md
      - Installation: get-started/installation.md
      # PROJECT-NAV-GET-STARTED-START — this server's first-run pages; kept across copier update
      # PROJECT-NAV-GET-STARTED-END
  - Deploy:
      - Overview: deploy/index.md
      - Docker: deploy/docker.md
      - systemd and packages: deploy/systemd.md
      - Authentication: deploy/authentication.md
      - OIDC: deploy/oidc.md
      - OIDC providers: deploy/oidc-providers.md
      - Reverse proxy: deploy/reverse-proxy.md
      - MCP Apps: deploy/mcp-apps.md
      - Transfer links: deploy/transfer-links.md
      # PROJECT-NAV-DEPLOY-START — this server's deployment additions; kept across copier update
      # PROJECT-NAV-DEPLOY-END
  - Use:
      - Overview: use/index.md
      # PROJECT-NAV-USE-START — this server's how-tos and explanations (docs/use/); kept across copier update
      - Embeddings: use/embeddings.md
      - Git integration: use/git-integration.md
      - Vault explorer: use/vault-explorer.md
      - Obsidian everywhere: use/obsidian-everywhere.md
      - Open Knowledge Format: use/okf.md
      - PARA: use/para.md
      - Zettelkasten: use/zettelkasten.md
      - Research workflows: use/research-workflows.md
      # PROJECT-NAV-USE-END
  # Reference is generated from the code by scripts/gen_reference.py; a fact
  # on these pages changes at its source (docstring, annotation, CLI help).
  - Reference:
      - Configuration: reference/configuration.md
      - Configuration generator: reference/configuration-generator.md
      - Tools:
          - Overview: reference/tools/index.md
          # GENERATED-NAV-TOOLS-START — one entry per tool group; written by scripts/gen_reference.py
          - Reader: reference/tools/reader.md
          - Graph: reference/tools/graph.md
          - Indexing: reference/tools/indexing.md
          - Writer: reference/tools/writer.md
          - Git: reference/tools/git.md
          - Vault app tools: reference/tools/vault_app_tools.md
          - Server info: reference/tools/server_info.md
          - Transfer: reference/tools/transfer.md
          - Summarize: reference/tools/summarize.md
          - Jobs: reference/tools/jobs.md
          # GENERATED-NAV-TOOLS-END
      - Resources: reference/resources.md
      - Prompts: reference/prompts.md
      - Command line: reference/cli.md
      # PROJECT-NAV-REFERENCE-START — resources, CLI, API reference (docs/reference/api/); kept across copier update
      - Python API:
          - Vault: reference/api/vault.md
          - Facets: reference/api/facets.md
          - Git integration: reference/api/git.md
          - Configuration: reference/api/config.md
          - Embedding providers: reference/api/providers.md
          - Types: reference/api/types.md
          - Exceptions: reference/api/exceptions.md
      # PROJECT-NAV-REFERENCE-END
  # Landing page only, deliberately: per-minor pages stay out of nav so a new
  # release never needs a nav edit (mkdocs treats not-in-nav pages as INFO,
  # so `--strict` stays green); the landing page and search link them.
  - Upgrade:
      - Overview: upgrade/index.md
      - Release notes: releases/index.md
      # PROJECT-NAV-UPGRADE-START — kept across copier update
      # PROJECT-NAV-UPGRADE-END
  - Contribute:
      - Overview: contribute/index.md
      - Documentation structure: contribute/docs-structure.md
      - Release process: contribute/release-process.md
      - Template updates: contribute/template-updates.md
      - Repository protection: contribute/repository-protection.md
      - Integration branches: contribute/integration-branches.md
      # PROJECT-NAV-CONTRIBUTE-START — kept across copier update
      # PROJECT-NAV-CONTRIBUTE-END
  # PROJECT-NAV-UNSORTED-START — entries the nav migration could not place; move each into a section above
  # PROJECT-NAV-UNSORTED-END
