name: Feature request
description: >
  Suggest a new feature or enhancement. Describe the problem, not a
  solution. See CONTRIBUTING.md for what makes a useful request.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the problem or unmet need, not a solution. Who hits it,
        and when?
    validations:
      required: true
  - type: textarea
    id: desired-outcome
    attributes:
      label: Desired outcome
      description: Describe the outcome, not how to implement it.
    validations:
      required: true
  - type: dropdown
    id: surface-impact
    attributes:
      label: Surface impact
      description: >
        Which compatibility surfaces the outcome would touch, as far as you
        can tell. Touching a surface does not by itself break compatibility.
        Apply `breaking` after filing only if an existing operator or
        library contract must break under the breaking-change policy.
        Pick "Not sure" rather than guess.
      multiple: true
      options:
        - Operator surface (config, env vars, CLI, deployment)
        - Public library API
        - MCP tool surface (tools, resources, prompts)
        - None (internal only)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: implementation-ideas
    attributes:
      label: Implementation ideas
      description: >
        Non-binding starting points only. This issue does not prescribe an
        implementation.
    validations:
      required: false
