# Versioned-docs refresh for release-notes pages edited AFTER their
# release shipped (template#347 → #419).  The primary notes flow needs no
# publish step at all any more: the promoted page travels inside the release
# PR, lands in the tagged tree on merge, is deployed with the release's own
# docs, and release.yml composes
# the release body — summary block, deep link — from the tagged tree at
# publish time.  What remains here is the one case that path cannot cover:
# a page on the default branch changing after its release's docs deployed
# (a hand edit, a backfill notes PR, or a port PR from a branch cut). The
# touched minor is then redeployed from its newest tag with the default
# branch's docs/releases/ overlaid, so the
# published /X.Y/ docs match the accumulated pages.
#
# Deterministic by design: nothing here generates content, and release
# bodies are never rewritten — use `gh release edit` for a body fix.
name: Release Notes Publish

on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/*.md'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Serialise with ourselves only; gh-pages races with docs.yml deploys are
    # reconciled by the fetch-reset-retry loop below, same as docs.yml.
    concurrency:
      group: release-notes-publish
      cancel-in-progress: false
    permissions:
      contents: write       # gh-pages push (mike deploy)
      pull-requests: read   # the release-merge gate's commits-to-PRs lookup
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: tags (locate each minor's releases) and the
          # gh-pages branch (mike) both live outside the pushed commit.
          fetch-depth: 0

      # A release PR's merge changes docs/releases/ too (the notes travel
      # inside it, template#419), but the RELEASE owns that deploy: docs.yml
      # builds the new tag's own docs on the release event.  Redeploying
      # here would race it — this workflow resolves "the series' newest
      # tag" BEFORE the release workflow has created the new one, so it
      # could overwrite the fresh deploy with the previous tag's content
      # (template#421).  Out-of-band page edits are this workflow's only
      # job, so a push whose head commit came from a release PR is skipped
      # wholesale.  Detection is merge-strategy independent: the commits
      # API associates the pushed head with its PR under squash, merge
      # commit, and rebase alike; on an API failure the check degrades to
      # the pinned squash subject (the repo's convention), which then
      # covers the common case.
      - name: Skip release-PR merges — the release deploys its own docs
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          skip=false
          head_sha="$(git rev-parse HEAD)"
          prep_prs="$(gh api "repos/${REPO}/commits/${head_sha}/pulls" \
            --jq '[.[] | select(.head.ref | startswith("knope/prepare/"))] | length' \
            2>/dev/null || echo "")"
          if [ "$prep_prs" != "" ] && [ "$prep_prs" != "0" ]; then
            skip=true
            echo "head ${head_sha} belongs to a knope/prepare/* PR — the release workflow owns this deploy; skipping"
          elif [ -z "$prep_prs" ]; then
            subject="$(git log -1 --format=%s HEAD)"
            if printf '%s' "$subject" | grep -qE '^chore: prepare release '; then
              skip=true
              echo "commits API unavailable; squash subject (${subject}) marks a release-PR merge — skipping"
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Find changed release pages
        if: steps.gate.outputs.skip != 'true'
        id: pages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Cover multi-commit pushes; on a forced push or missing before-SHA
          # fall back to the head commit alone.
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..HEAD"
          else
            range="HEAD^..HEAD"
          fi
          # next\.md is staging, not a canonical release page.
          git diff --name-only --diff-filter=AM "$range" -- 'docs/releases/*.md' \
            | grep -vE '/(index|next)\.md$' > changed-pages.txt || true
          if [ -s changed-pages.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            cat changed-pages.txt
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "only index or staging files changed — nothing to publish"
          fi

      - name: Install uv
        if: steps.pages.outputs.found == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        if: steps.pages.outputs.found == 'true'
        run: uv python install 3.12

      - name: Install docs dependencies
        if: steps.pages.outputs.found == 'true'
        run: uv sync --no-default-groups --group docs --frozen

      - name: Redeploy versioned docs with the merged pages
        if: steps.pages.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MAIN_REF=$(git rev-parse HEAD)
          while IFS= read -r page; do
            minor=$(basename "$page" .md)
            echo "$minor" | grep -qE '^[0-9]+\.[0-9]+$' || continue
            TAG=$(git tag --list | grep -E "^v${minor//./\\.}\.[0-9]+$" | sort -V | tail -1 || true)
            [ -n "$TAG" ] || continue
            ver="${TAG#v}"
            # Build the minor's docs from its newest tag — the content that
            # release actually shipped — with the default branch's notes
            # pages overlaid on top.  `--no-sync` reuses the docs venv
            # installed above instead of re-locking against the tag.
            git checkout --force "$TAG"
            git checkout "$MAIN_REF" -- docs/releases
            deployed=""
            # Deploys race with docs.yml's push/release buckets on gh-pages;
            # on a rejected push, re-sync the local gh-pages ref and redo the
            # deploy on the fresh tip (same loop as docs.yml).
            for attempt in 1 2 3; do
              git fetch origin gh-pages || true
              if git rev-parse -q --verify refs/remotes/origin/gh-pages > /dev/null; then
                git update-ref refs/heads/gh-pages refs/remotes/origin/gh-pages
              fi
              if uv run --no-sync mike deploy --push --title "$ver" "$minor"; then
                deployed=1
                break
              fi
            done
            [ "$deployed" = "1" ] \
              || { echo "::error::docs redeploy for ${minor} failed after 3 attempts"; exit 1; }
            git checkout --force "$MAIN_REF"
          done < changed-pages.txt
