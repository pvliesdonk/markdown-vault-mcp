name: Post Coverage Status

# Posts the codecov/patch commit status for fork PRs, where the test job's
# GITHUB_TOKEN is read-only and cannot write statuses directly (GitHub security
# restriction for pull_request events from forks).
#
# workflow_run always executes in the base-repo context, so GITHUB_TOKEN here
# has statuses: write regardless of where the PR originates.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  post-status:
    name: Post codecov/patch status
    # Only needed for fork PRs — own-branch PRs post the status directly in the
    # test job. Push events don't upload the artifact so we'd have nothing to read.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      actions: read

    steps:
      - name: Download patch coverage artifact
        id: download
        # Never fatal: a failed download must still reach the posting step
        # below, which turns it into an `error` status. See that step.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: patch-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post codecov/patch status
        # ALWAYS post something. `ci.yml`'s own-branch counterpart holds the
        # same invariant (`always()` plus an `|| 'error'` default), and this
        # fork-PR fallback has to match it: a project that answers
        # `extra_required_checks: ["codecov/patch"]` makes this a required
        # context, and a required check that never reports does not turn a PR
        # red — it leaves it waiting forever on a status that is not coming,
        # exitable only by an admin bypass or a ruleset edit.
        #
        # So an expired or evicted artifact, a transient API failure, or a
        # `download-artifact` behaviour change becomes an `error` status,
        # which a maintainer clears by re-running this workflow. Reporting
        # nothing is the one outcome with no recovery inside the normal flow.
        #
        # An absent artifact is `error`, not `success`: the job's `if:` above
        # already excludes push events, so within the fork-PR case it means
        # the test job never got far enough to write one — which is a broken
        # run, not "the diff touched no covered lines".
        if: always()
        uses: actions/github-script@v9
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = await import('node:fs');
            let state = 'error';
            let description = 'patch coverage artifact unavailable';
            if (process.env.DOWNLOAD_OUTCOME === 'success') {
              try {
                const payload = JSON.parse(fs.readFileSync('patch-coverage.json', 'utf8'));
                state = payload.state || 'error';
                description = payload.description || 'patch coverage result was empty';
              } catch (err) {
                description = `patch coverage artifact unreadable: ${err.message}`;
              }
            }
            const sha = context.payload.workflow_run.head_sha;
            core.info(`Posting codecov/patch: ${state} — ${description} to ${sha}`);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'codecov/patch',
              description,
              target_url: 'https://app.codecov.io/gh/pvliesdonk/markdown-vault-mcp',
            });
