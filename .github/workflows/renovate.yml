name: Renovate

# Self-hosted Renovate for this project. Keeps uv.lock current within the
# pyproject.toml floors (lockFileMaintenance) and auto-merges patch/minor
# updates once CI is green. GitHub Actions are intentionally NOT managed here —
# their pins are maintained upstream in the template and arrive via template
# updates, not per-repo.

on:
  schedule:
    # Every 4 hours, 7 minutes past to sidestep GitHub's top-of-hour delay.
    # Renovate's own schedules gate what a run may do (hour granularity, UTC);
    # the 00:07 Monday run lands inside lockFileMaintenance's declared
    # "before 4am on monday" window, which a single 06:00 cron never hit
    # (scripts/tests/test_renovate_downstream_config.py keeps the two aligned).
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Renovate
        # Exact pin: renovatebot/github-action publishes no floating major tag
        # (a bare @v46 does not resolve and fails the job before any step).
        # v46.x bundles a Renovate CLI well past the >=43.59.0 floor (fixes the
        # PEP 735 [dependency-groups] depName bug); do not pin an older renovate-version.
        uses: renovatebot/github-action@v46.2.4
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RELEASE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
