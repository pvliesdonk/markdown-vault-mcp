name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    # release/** keeps backport PRs CI-gated: the shipped rulesets
    # (.github/rulesets/) require the CI Success check on release/* exactly
    # as on main, which deadlocks unless CI actually runs there.
    branches: [main, "release/**"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up project environment
        uses: ./.github/actions/setup-project-env


      - name: Verify vendored SPA is up-to-date
        run: uv run python scripts/vendor_spa.py --check

      - name: Verify generated config artifacts are up-to-date
        run: uv run python scripts/gen_config_surface.py --check

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up project environment
        uses: ./.github/actions/setup-project-env

      - name: Run mypy
        run: uv run mypy src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Prevent a stalled `uv python install` from blocking the PR for hours.
    # 20 min covers the full test matrix with headroom; cold interpreter
    # downloads from python-build-standalone are the most likely stall source.
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental || false }}
    permissions:
      contents: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            experimental: false
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags inform the release-contract tests (template#387): without
          # them a checkout of a repo that HAS releases looks like a fresh
          # project, and the tag-coupled asserts mis-skip instead of running.
          # Full depth because the pins invariant is REACHABILITY-scoped
          # (`git tag --merged HEAD`, series-aware on release/* branches) —
          # on a shallow clone no tag is reachable and the test would
          # silently skip.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up project environment
        uses: ./.github/actions/setup-project-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          override_pr: ${{ github.event.pull_request.number }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Fetch base branch for diff-cover
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=50

      - name: Check patch coverage
        id: diffcover
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Check if PR has Python source changes
          HAS_PY=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -c '\.py$' || true)
          if [ "$HAS_PY" -eq 0 ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
            echo "description=Coverage not affected" >> "$GITHUB_OUTPUT"
            echo "No Python source changes — skipping diff-cover"
          else
            OUTPUT=$(uv run diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=80 2>&1) && RC=0 || RC=$?
            echo "$OUTPUT"
            TOTAL=$(echo "$OUTPUT" | grep -oP 'Total:\s+\K[\d.]+' || true)
            if [ -z "$TOTAL" ] && [ "$RC" -ne 0 ]; then
              echo "state=error" >> "$GITHUB_OUTPUT"
              echo "description=diff-cover failed to compute patch coverage" >> "$GITHUB_OUTPUT"
            elif [ -z "$TOTAL" ]; then
              echo "state=success" >> "$GITHUB_OUTPUT"
              echo "description=No coverable lines in diff" >> "$GITHUB_OUTPUT"
            elif [ "$RC" -eq 0 ]; then
              echo "state=success" >> "$GITHUB_OUTPUT"
              echo "description=Patch coverage: ${TOTAL}%" >> "$GITHUB_OUTPUT"
            else
              echo "state=failure" >> "$GITHUB_OUTPUT"
              echo "description=Patch coverage: ${TOTAL}% (minimum 80%)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Save patch coverage result
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        env:
          PATCH_STATE: ${{ steps.diffcover.outputs.state || 'error' }}
          PATCH_DESC: ${{ steps.diffcover.outputs.description || 'diff-cover step did not run' }}
        run: |
          jq -n --arg state "$PATCH_STATE" --arg description "$PATCH_DESC" \
            '{"state":$state,"description":$description}' > patch-coverage.json

      - name: Upload patch coverage artifact
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: patch-coverage
          path: patch-coverage.json
          retention-days: 1

      - name: Post codecov/patch status
        # Fork PRs: GITHUB_TOKEN is read-only for pull_request events from forks regardless
        # of the permissions block — GitHub security restriction. continue-on-error prevents
        # the job from failing; coverage-status.yml posts the status via workflow_run instead.
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PATCH_STATE: ${{ steps.diffcover.outputs.state }}
          PATCH_DESC: ${{ steps.diffcover.outputs.description }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const state = process.env.PATCH_STATE || 'error';
            const description = process.env.PATCH_DESC || 'diff-cover step did not run';
            const headSha = context.payload.pull_request.head.sha;
            core.info(`Posting codecov/patch: ${state} — ${description} to ${headSha}`);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state,
              context: 'codecov/patch',
              description,
              target_url: 'https://app.codecov.io/gh/pvliesdonk/markdown-vault-mcp',
            });

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up project environment
        # No sync: this job resolves the dependency list with `uv export` and
        # runs pip-audit through `uvx`, so it never imports the project and
        # does not need a venv built for it.
        uses: ./.github/actions/setup-project-env
        with:
          sync: "false"

      - name: Export dependency list (excluding local project)
        # `dev` is uv's only auto-activated default group, so --no-default-groups
        # excludes it; `docs` is non-default and never exported unless explicitly
        # requested via --group/--all-groups (neither passed here). Net effect:
        # only runtime + user-defined extras land in the audit input — avoids
        # spurious CVE reports against tooling (pip-audit's own `pip` dep, etc.)
        # that does not run in production.
        run: uv export --all-extras --no-default-groups --frozen --no-emit-project --no-hashes -o ${{ runner.temp }}/requirements.txt

      - name: Run pip-audit
        run: |
          uvx pip-audit --strict --progress-spinner off \
            --ignore-vuln CVE-2026-42561 \
            -r ${{ runner.temp }}/requirements.txt
          # CVE-2026-42561: python-multipart <0.0.27, pulled in transitively by
          # fastmcp/starlette. Ignored until the upstream pin chain propagates
          # the fix to 0.0.27. Remove once `uv lock` resolves >=0.0.27.

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vale:
    name: Docs Prose (Vale)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # vale-cli/vale-action posts findings as PR annotations via reviewdog.
      # The default reporter (`github-pr-annotations`) uses the GitHub Checks
      # API — `checks: write` is sufficient. If a downstream switches the
      # reporter to `github-pr-review` (inline PR review comments), they
      # need to add `pull-requests: write` here too.
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Cache Vale style packages
        # Cache only the downloaded pack directories — NOT .vale/styles/config/.
        # The config/ subtree (accept.txt vocabulary) is tracked by git and must
        # stay authoritative from checkout. Caching the whole .vale/styles tree
        # would let restore-keys overwrite a newly-added vocab term with the
        # stale snapshot on the exact PR that adds the term.
        # Pack list mirrors the Packages = line in .vale.ini. That line is the
        # source of truth and THREE places restate it by hand: this path: list,
        # BasedOnStyles in .vale.ini, and the `for p in` list in the vale-sync
        # pre-commit hook. Adding or removing a pack means changing all three —
        # a stale BasedOnStyles makes vale exit E100 [loadStyles], and a stale
        # `for p in` leaves the pre-commit hook blind to the new pack so it
        # never triggers a sync.
        # Bump the v1- prefix to evict all cached
        # packs if Vale changes pack format backward-incompatibly.
        #
        # NOTE: this cache does not prevent a re-download, and cannot while
        # this job uses vale-action. `vale sync` wipes and re-creates every
        # directory in `Packages =` rather than consulting what is on disk
        # (verified with canary files), so a restored cache is discarded before
        # it is read unless the sync is skipped — and vale-action runs
        # `vale sync` unconditionally (`src/input.ts:67`) with no input to skip
        # it (both checked at the pinned SHA below). This is a constraint of
        # the action, not a trade being declined: the only route to a
        # load-bearing cache here is replacing vale-action with a direct
        # invocation, giving up reviewdog annotations, filter_mode and
        # fail_on_error. The template's own CI gate calls vale directly and so
        # does guard its sync.
        uses: actions/cache@v6
        with:
          path: |
            .vale/styles/Google
            .vale/styles/proselint
            .vale/styles/write-good
            .vale/styles/ai-tells
          key: vale-styles-v1-${{ hashFiles('.vale.ini') }}
          # Warm-start fallback, kept for symmetry with the key. It does NOT
          # save a re-fetch: per the NOTE above, `vale sync` discards whatever
          # was restored and re-creates every pack directory. An earlier
          # revision of this comment claimed the restore let vale sync
          # "re-fetch only the changed pack"; that is not how vale sync
          # behaves.
          restore-keys: vale-styles-v1-

      - name: Run Vale
        # SHA pin matches the gitleaks-action pattern earlier in this file.
        # The current release is named "v2.1.2" in the GitHub UI but the
        # underlying git tag is `2.1.2` (no `v` prefix) — pinning to the
        # SHA sidesteps that mismatch and provides supply-chain hygiene.
        uses: vale-cli/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a  # v2.1.2
        with:
          # Pin Vale CLI version explicitly. Bump in lockstep with the
          # pre-commit hook `rev:` in .pre-commit-config.yaml — template-ci
          # asserts the two stay synchronized.
          version: "3.14.2"
          # Lint the published docs site plus the user-facing README. Both are
          # operator-facing prose and must stay Vale-clean. Internal dev docs
          # are excluded via the glob below. Multiple paths MUST be a JSON
          # array: vale-action only splits the `files` string when `separator`
          # is set (it defaults to empty), so a space- or comma-joined string
          # silently falls back to linting the whole repo (".").
          files: '["docs", "README.md"]'
          # Dev-reference docs (working specs, design notes, ADRs) follow
          # internal conventions, not user-facing prose style — exclude from
          # linting. This mirrors the mkdocs `exclude_docs:` block, which keeps
          # design/** and decisions/** out of the published site. Use ONE
          # `--glob` with brace alternation: Vale honors only a single `--glob`
          # pattern (a repeated flag keeps just the last), so the subtrees must
          # be combined as `{a,b,c}`. NO inner single quotes around the glob
          # value: vale-action splits `vale_flags` on whitespace and passes
          # argv elements directly (no shell), so literal quotes here would be
          # passed through to Vale, the glob would match no files, and CI would
          # silently exit 0. Verified empirically. Keep the subtree set in sync
          # with the pre-commit `- id: vale` exclude (template-ci asserts it).
          vale_flags: "--glob=!docs/{superpowers,design,decisions}/**"
          # Failure gating is controlled by MinAlertLevel = error in
          # .vale.ini (governs both what Vale prints AND its exit code)
          # combined with fail_on_error below — only error-severity
          # findings fail CI; warnings and suggestions surface as advisory
          # annotations. (The action also accepts a `level:` input, but at
          # the pinned SHA that input is declared but never read — the
          # reviewdog level is derived from Vale's exit code and
          # fail_on_error. Setting it here would be a no-op.)
          fail_on_error: true
          # filter_mode defaults to `added` — only findings on lines this PR
          # adds or modifies fail the build. Pre-existing prose debt isn't a
          # blocker for new contributions; downstream's own untouched docs
          # don't gate PRs that don't touch them. To enforce repo-wide
          # cleanliness, set this to `nofilter`.
          filter_mode: added


  structure:
    name: Structural Quality (diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Diff-scoped, so only meaningful on a PR (needs a base branch to compare).
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up project environment
        uses: ./.github/actions/setup-project-env

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=50

      - name: Structural quality (changed lines only)
        # One implementation, shared with the pre-push hook. The explicit
        # STRUCTURAL_GATE_BASE pins the PR's actual base branch (main or a
        # release/X.Y for backport PRs); the script's no-Python skip and the
        # diff-quality invocation live in the script.
        env:
          STRUCTURAL_GATE_BASE: origin/${{ github.base_ref }}
        run: bash scripts/structural_gate.sh


  pr-title:
    name: PR Title
    # A squash merge takes the pull-request title as the commit subject, and
    # knope silently ignores a subject it does not count (only feat / fix /
    # `!` reach the version computation and CHANGELOG.md — no fallback
    # heading, no warning). This is the last point at which that subject can
    # still be corrected.
    #
    # PR-only by design: under the release-PR flow every commit reaches
    # `main` through a pull request whose title this gate already checked.
    # On push/dispatch the job is skipped, which the `ci-success` aggregate
    # below treats as a pass.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check pull-request title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Read the CURRENT title from the API rather than from
        # `github.event.pull_request.title`. A re-run replays the original
        # event payload, so an author who fixes the title would otherwise have
        # to push a commit to clear a red check that a retitle already fixed.
        run: |
          set -euo pipefail
          TITLE="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .title)"
          python3 scripts/check_pr_title.py "$TITLE"

  ci-success:
    name: CI Success
    # Single aggregate gate for branch protection / Renovate auto-merge to
    # require. Succeeds only if every upstream job succeeded or was skipped;
    # fails if any failed or was cancelled. Requiring this ONE context is
    # drift-proof — renaming an individual job never silently disables the gate.
    needs:
      - lint
      - typecheck
      - test
      - audit
      - secrets
      - vale
      - pr-title

      - structure

    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job did not pass (result: $result)"
              exit 1
            fi
          done
          echo "All required jobs passed."
