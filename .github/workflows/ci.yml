name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    # release/** keeps backport PRs CI-gated: the shipped rulesets
    # (.github/rulesets/) require the CI Success check on release/* exactly
    # as on main, which deadlocks unless CI actually runs there.
    branches: [main, "release/**"]
  workflow_dispatch:

jobs:
  ci:
    # The gate itself lives in the template repository as a reusable workflow
    # (template#538); this stub carries only the per-project wiring. The pin
    # is the template commit this project was rendered from — a template
    # update re-renders it, so CI logic updates arrive as a one-line diff
    # here instead of a whole-file merge. The called jobs run in THIS
    # repository's context: they check out this repo and use its rendered
    # ./.github/actions/setup-project-env composite. Detaching from the
    # template? FORKING.md's detach steps vendor the called workflow into
    # this repository.
    #
    # `permissions:` here is the union of what the called jobs need; each
    # job inside the reusable workflow narrows it further per-job.
    uses: pvliesdonk/fastmcp-server-template/.github/workflows/reusable-ci.yml@d4cc9dd14557ac335a70881e54aeb45f574119b3
    permissions:
      contents: read
      statuses: write   # test job posts the codecov/patch commit status
      checks: write     # vale posts reviewdog annotations via the Checks API
    with:
      include-mcp-apps-scaffold: true
      enable-structural-gate: true
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  pr-title:
    name: PR Title
    # A squash merge takes the pull-request title as the commit subject, and
    # knope silently ignores a subject it does not count (only feat / fix /
    # `!` reach the version computation and CHANGELOG.md — no fallback
    # heading, no warning). This is the last point at which that subject can
    # still be corrected.
    #
    # PR-only by design: under the release-PR flow every commit reaches
    # `main` through a pull request whose title this gate already checked.
    # On push/dispatch the job is skipped, which the `ci-success` aggregate
    # below treats as a pass.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check pull-request title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Read the CURRENT title from the API rather than from
        # `github.event.pull_request.title`. A re-run replays the original
        # event payload, so an author who fixes the title would otherwise have
        # to push a commit to clear a red check that a retitle already fixed.
        run: |
          set -euo pipefail
          TITLE="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .title)"
          python3 scripts/check_pr_title.py "$TITLE"

  ci-success:
    name: CI Success
    # Single aggregate gate for branch protection / Renovate auto-merge to
    # require. Succeeds only if every upstream job succeeded or was skipped;
    # fails if any failed or was cancelled. Requiring this ONE context is
    # drift-proof — renaming an individual job never silently disables the gate.
    needs:
      - ci
      - pr-title
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required job did not pass (result: $result)"
              exit 1
            fi
          done
          echo "All required jobs passed."
