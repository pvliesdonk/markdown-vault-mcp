# Release-PR flow, half one of two (knope; fastmcp-server-template#406).
# Dispatch this workflow on the ref to release from (`main` for a trunk
# release, `release/X.Y` for an rc or its promotion).  It computes the
# version from conventional commits, stamps the version-coupled files, and
# opens (or refreshes) the release PR against the dispatched ref.  Merging
# that PR is the release decision — release.yml tags the merge commit and
# runs the publish fan-out.
#
# Operator rules (load-bearing — see release-vision sections 4.1/4.2):
#   * NEVER use GitHub's "Update branch" button on a release PR — it merges
#     the base into the prep branch behind the tool's back and routes around
#     the recreate rule below.  The only refresh is re-dispatching this
#     workflow.
#   * The ruleset's strict required checks already hard-block merging a
#     stale release PR; re-dispatch instead of merging around staleness.
name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel. auto = rc on release/* branches, stable elsewhere; rc / stable override the derivation (promotion of an rc series IS the explicit stable run on its branch).'
        type: choice
        default: auto
        options:
          - auto
          - rc
          - stable
      override_version:
        description: 'Optional explicit version (X.Y.Z or X.Y.Z-rc.N). Overrides BOTH commit analysis and the channel input — the version is used exactly as given, so include any -rc.N suffix yourself. The remedy for ranges knope counts nothing in (perf/chore-only) and for a version collision after a branch-only release.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      prep_branch: ${{ steps.prep.outputs.branch }}
    permissions:
      contents: read
      # For the advisory quiescence step's issue/milestone reads.
      issues: read
      # For the version-reservation check's open-release-PR listing.
      pull-requests: read
    # ONE global bucket, deliberately not per base: the version-reservation
    # step below reads the open release PRs BEFORE CreatePullRequest writes
    # this run's own, so two concurrent prepares on DIFFERENT bases
    # computing the same version could otherwise both pass the check and
    # open two mergeable release PRs racing for one tag.  Serializing the
    # whole job makes check-through-create atomic — the second prepare
    # always sees the first's open PR.  A prepare is short, so cross-base
    # queueing costs seconds; cancel-in-progress stays false — cancelling
    # one mid-push could leave a half-refreshed release PR.  (GitHub keeps
    # one PENDING run per group: a third simultaneous dispatch cancels the
    # second's queued run, visibly — just re-dispatch it.)
    concurrency:
      group: release-prepare
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Checkout the dispatched ref (full depth, with tags)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # Full history + tags: knope computes the version from the
          # conventional commits since the last release tag in this ref's
          # ancestry.
          fetch-depth: 0
          fetch-tags: true
          # RELEASE_TOKEN (PAT), persisted for the prep-branch push (M1): a
          # GITHUB_TOKEN-authored release PR triggers no workflows, so the
          # required `CI Success` check would never report and the PR would
          # be unmergeable forever — the same reason the automated
          # template-update PRs use this token.
          token: ${{ secrets.RELEASE_TOKEN }}

      # Swap-completeness guard (migration P1.0/P2) — must stay the first
      # step after checkout.  During the additive phase this interlock kept
      # the knope flow inert while python-semantic-release was still the
      # release path; the PSR config block is gone now, so it always passes
      # — and it stays here so the two release models can never both be
      # live again.  If this fails, a `[tool.semantic_release]` block has
      # reappeared in pyproject.toml.
      - name: Refuse while python-semantic-release is still the release path
        run: |
          if grep -q '^\[tool\.semantic_release\]' pyproject.toml; then
            echo "::error::pyproject.toml carries a [tool.semantic_release] block — the PSR and knope release flows must never both be live. Remove the block (the knope release-PR flow is this project's release path), or remove the knope machinery before resurrecting PSR."
            exit 1
          fi
          echo "interlock: no [tool.semantic_release] block — knope flow is armed"

      # Only the default branch and release/X.Y stabilisation branches
      # release (the PSR-era branch groups' refusal, carried over as an
      # explicit gate): a feature branch's ancestry would compute a bogus
      # version, and its release PR would target a branch no publish should
      # ever run from.  release.yml enforces the same rule on the merged
      # PR's base as defense in depth.
      - name: Refuse a non-releasable ref
        env:
          REF: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          # Exactly release/X.Y, not release/* — the documented stabilisation
          # form.  Deeper or dashed names would also collide in the lossy
          # slash-to-dash prep-branch encoding (release/4.0/hotfix and
          # release/4.0-hotfix map to the same prep branch), so restricting
          # to X.Y keeps that encoding injective by construction.
          if [ "$REF" = "$DEFAULT" ] || printf '%s' "$REF" | grep -Eq '^release/[0-9]+\.[0-9]+$'; then
            echo "releasable ref: $REF"
          else
            echo "::error::'${REF}' is not a releasable ref — dispatch Release Prepare on '${DEFAULT}' or a release/X.Y stabilisation branch (exactly X.Y, the documented form). Other branches release nothing (their ancestry would compute a bogus version)."
            exit 1
          fi

      # Advisory only (never blocks — the cut may be intentional, or belong
      # on a release/X.Y branch cut from an earlier commit).  Runs at
      # prepare time, where the release decision is actually being drafted.
      # Surfaces both queryable quiescence signals the epic conventions
      # record:
      #   * the preferred milestone — a release-named milestone (X.Y) with
      #     open issues means that version is not yet safe to cut; and
      #   * the ships-atomically label — for each open epic it also counts
      #     open native sub-issues, which may live in another repo, so a
      #     cross-repo epic whose children are elsewhere stays visible.
      # Every gh call is guarded so a failure or an unsupported endpoint
      # degrades to no warning rather than failing the step under pipefail.
      - name: Warn about open ships-atomically epics and release milestones
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # (1) Open ships-atomically epics, each with a count of still-open
          #     children (native sub-issues — cross-repo aware).
          epics=$(gh issue list --repo "$REPO" --label ships-atomically \
            --state open --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"' 2>/dev/null || true)
          if [ -n "$epics" ]; then
            printf '%s\n' "$epics" | while IFS="$(printf '\t')" read -r num title; do
              [ -n "$num" ] || continue
              kids=$(gh api "repos/$REPO/issues/$num/sub_issues" \
                --jq '[.[] | select(.state == "open")] | length' 2>/dev/null || echo '?')
              # A still-open epic whose children are all closed is quiescent —
              # no warning. '?' (the sub-issues query failed) is unknown, so it
              # still warns rather than staying silent on a real risk.
              [ "$kids" = "0" ] && continue
              echo "::warning::Open ships-atomically epic #$num ($title) — $kids open child issue(s). Releasing $REPO@main ships HEAD mid-story; consider a release/X.Y branch cut from before the epic started."
            done || true
          fi
          # (2) The preferred signal: a release-named milestone that still has
          #     open issues — that version is not yet quiescent. Accepts X.Y,
          #     optionally v-prefixed and/or with a patch component
          #     (v3.2 / 3.2.0 / v3.2.0), not bare X.Y alone.
          milestones=$(gh api "repos/$REPO/milestones?state=open&per_page=100" \
            --jq '.[] | select(.open_issues > 0) | select(.title | test("^v?[0-9]+[.][0-9]+([.][0-9]+)?$")) | "\(.title): \(.open_issues) open issue(s)"' 2>/dev/null || true)
          if [ -n "$milestones" ]; then
            printf '%s\n' "$milestones" | while IFS= read -r ms; do
              [ -n "$ms" ] || continue
              echo "::warning::Release milestone $ms — not yet safe to cut that version from a quiescent trunk."
            done || true
          fi

      # knope-dev/action installs the pinned knope CLI.  Renovate: the
      # action ref is covered by the template repo's jinja-workflow regex
      # manager, and the `version:` input below by its knope-cli regex
      # manager (github-releases, depName knope-dev/knope) — keep the
      # `version:` key on its own line so that manager keeps matching.
      - name: Install knope
        uses: knope-dev/action@v2.1.2
        with:
          version: 0.23.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # rc by default on release/* branches, stable elsewhere; an explicit
      # channel input overrides.  Deriving the channel PURELY from the
      # branch was live-tested and rejected (release-vision section 4.1): it
      # makes the plain stable promotion run unreachable on the very
      # release/X.Y branch that needs it.  A non-empty override_version
      # replaces the whole derivation: the version is used exactly as given
      # (its own -rc.N suffix, or lack of one, is the channel), validated
      # here so an arbitrary string can never reach the knope command line.
      - name: Derive the release channel
        id: channel
        env:
          CHANNEL: ${{ inputs.channel }}
          OVERRIDE: ${{ inputs.override_version }}
        run: |
          if [[ -n "$OVERRIDE" ]]; then
            [[ "$OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] \
              || { echo "::error::override_version '${OVERRIDE}' is not a valid version — expected X.Y.Z or X.Y.Z-rc.N"; exit 1; }
            flags="--override-version ${OVERRIDE}"
            echo "channel resolved: override_version=${OVERRIDE} (channel input '${CHANNEL}' ignored — the override's form decides rc vs stable)"
          else
            case "$CHANNEL" in
              rc) flags="--prerelease-label rc" ;;
              stable) flags="" ;;
              *)
                flags=""
                if [[ "$GITHUB_REF_NAME" == release/* ]]; then
                  flags="--prerelease-label rc"
                fi
                ;;
            esac
            echo "channel resolved: input=$CHANNEL ref=$GITHUB_REF_NAME flags='${flags}'"
          fi
          echo "flags=${flags}" >> "$GITHUB_OUTPUT"

      # knope 0.23.0's CreatePullRequest `base` is a plain string (not
      # templatable — spike-verified), so patch it to the dispatched ref
      # here.  The patched knope.toml stays uncommitted: knope's prepare
      # commit stages only the release files.
      - name: Point the release PR base at the dispatched ref
        run: sed -i "s|^base = .*|base = \"${GITHUB_REF_NAME}\"|" knope.toml

      # ALWAYS recreate the prep branch from the dispatched base — never
      # re-run preparation on a stale prep branch: re-running on
      # already-stamped files does not refuse, it computes the NEXT version
      # on top of the stamped one (the double-bump trap, observed in the
      # spike).  The branch is namespaced per base (slashes sanitized to
      # dashes) so concurrent release PRs on main and release/X.Y coexist,
      # and so prep branches stay outside the release/** ruleset whose
      # non-fast-forward rule would block this force-recreate flow.
      - name: Recreate the prep branch from the dispatched base
        id: prep
        run: |
          branch="knope/prepare/${GITHUB_REF_NAME//\//-}"
          git switch --force-create "$branch"
          {
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"

      # The version knope is about to prepare must not already carry a tag
      # ANYWHERE in the repo.  Version computation is ancestry-local and the
      # port-bookkeeping PR deliberately never ports version stamps, so a
      # trunk prepare after a branch-only release can recompute an
      # already-released version — without this gate that collision would
      # surface only at tag time, after the release PR merged.  The dry run
      # prints the exact version the real run below would stamp (same
      # flags, same commits); its output format is pinned by knope 0.23.0.
      #
      # Tags are not the only claim on a version: another base's OPEN
      # release PR reserves the version it prepares (merging it creates the
      # tag), so the second half checks the open `knope/prepare/*` PRs'
      # stamped versions too — first-merged would otherwise win the tag and
      # strand the other release PR at tag time.
      - name: Refuse a version that is already tagged or reserved
        id: reserve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREP_BRANCH: ${{ steps.prep.outputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          version="$(knope prepare-release --dry-run ${{ steps.channel.outputs.flags }} \
            | sed -n 's/^Would add the following to pyproject.toml: //p' | head -1)"
          if [ -z "$version" ]; then
            echo "::error::could not parse the computed version from knope's dry run — the knope pin and this parser must move together"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "::error::v${version} is already tagged in this repository (most likely released from another branch whose version stamps were never ported). Re-dispatch with override_version set to an untaken version, or land a version-stamp port to ${GITHUB_REF_NAME} first."
            exit 1
          fi
          # Reservation check across other bases' open release PRs.  The
          # reserved version is read from each prep head's committed
          # pyproject.toml — the same file release.yml derives the tag from
          # on merge — never from the PR title, which is mutable: a
          # retitled release PR would silently drop its reservation while
          # remaining every bit as mergeable and taggable.  Every gh call
          # is guarded: on an API hiccup the check degrades to the tag-only
          # refusal above (an open-PR collision then still refuses at tag
          # time) rather than failing a prepare the outage never made
          # wrong; a prep-named head whose pyproject cannot be read (e.g. a
          # fork branch, which release.yml refuses anyway) is skipped.
          reserved="$(gh pr list --state open --limit 100 --json headRefName \
            --jq '.[] | select(.headRefName | startswith("knope/prepare/")) | .headRefName' \
            2>/dev/null || true)"
          if [ -n "$reserved" ]; then
            while IFS= read -r head; do
              [ -n "$head" ] || continue
              [ "$head" = "$PREP_BRANCH" ] && continue
              other="$(gh api "repos/${REPO}/contents/pyproject.toml?ref=${head}" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
                | sed -n 's/^version = "\(.*\)"/\1/p' | head -1 || true)"
              [ -n "$other" ] || continue
              if [ "$other" = "$version" ]; then
                echo "::error::version ${version} is already reserved by the open release PR from '${head}' (its stamped pyproject.toml carries ${other}) — merging both would race for tag v${version}. Merge or close that release PR first, or re-dispatch with override_version set to an untaken version."
                exit 1
              fi
            done <<< "$reserved"
          fi
          echo "computed version ${version} is untaken and unreserved — proceeding"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # knope's prepare-release workflow (knope.toml): PrepareRelease bumps
      # pyproject.toml and writes the changelog section, the stamp Command
      # rewrites uv.lock's self-version entry (every release, PEP 440
      # canonical spelling) and the install-channel manifests (stable only),
      # the notes promotion Command deterministically moves staging into the
      # canonical page, the commit Command creates the prep commit, and the
      # promotion guard then
      # gates a stable promotion at PREPARE time (release-vision D10's early
      # layer: a drifted promotion refuses HERE, before the push and
      # CreatePullRequest Commands ever run, so it never becomes a mergeable
      # PR — release.yml's tag-time guard remains the immutable-tag
      # backstop), the force-push Command publishes the prep branch (name
      # via KNOPE_PREP_BRANCH), and CreatePullRequest opens or refreshes the
      # release PR against the base patched above.
      - name: Prepare the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          KNOPE_PREP_BRANCH: ${{ steps.prep.outputs.branch }}
        run: knope prepare-release --verbose ${{ steps.channel.outputs.flags }}
