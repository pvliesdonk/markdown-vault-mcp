# Agent-written release notes (template#347, reshaped by template#419).
# The notes page under docs/releases/ is a document with exactly the
# changelog's lifecycle — written by release preparation, reviewed in the
# release PR, landed by its merge, present in every tag by construction.
# It differs from CHANGELOG.md only in author and source material: an agent
# researches the release range through the GitHub API — commits, their PRs,
# the PRs' linked issues; never commit subjects.  The research contract
# (theme fan-out, evidence rules, page format, Vale loop) lives in
# .claude/skills/writing-release-notes/; this workflow supplies context,
# tools, and the mechanical commit.
#
# Two entries:
#   * workflow_call — the primary path.  release-prepare.yml's draft-notes
#     job calls this after knope opens the release PR; the drafted page is
#     committed ONTO the prep branch (lease-guarded), so the release PR's
#     diff carries stamps + changelog + notes and merging it puts the page
#     in the tagged tree.  Every release PR, rc and stable alike.
#   * workflow_dispatch — the backfill / re-draft tool: tag mode drafts a
#     standalone notes PR for an already-shipped release (e.g. a release
#     prepared with skip_notes); target_version mode re-drafts against an
#     open release PR without re-running the whole prepare.
name: Release Notes

on:
  workflow_call:
    inputs:
      target_version:
        description: 'Target version of the open release PR (X.Y.Z or X.Y.Z-rc.N — an rc drafts its stable minor page).'
        type: string
        required: true
      source_ref:
        description: 'The release PR source commit that ends the research range.'
        type: string
        required: true
      prep_branch:
        description: 'The knope/prepare/* branch to commit the drafted page onto.'
        type: string
        required: true
      expected_head:
        description: 'The prep-branch head the draft was cut against; the push is leased on it so a newer Release Prepare re-dispatch is never clobbered.'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Backfill: stable tag to draft a standalone notes PR for (e.g. v1.2.0). Empty = newest stable tag. Mutually exclusive with target_version.'
        type: string
        default: ''
      # Prepare-time re-draft (fastmcp-server-template#406, migration P1.5):
      # refresh a draft against an open release PR without re-running the
      # whole prepare.  The research range generalizes to "newest stable
      # tag strictly below the target ... the release PR's source commit";
      # the evidence rules are unchanged, only the range endpoints move.
      target_version:
        description: 'Re-draft against an OPEN release PR: the exact version its pyproject.toml carries (e.g. 4.0.0 or 4.0.0-rc.2). The draft lands on that PR''s prep branch, like the prepare-time run. Empty = tag mode (standalone backfill PR for a shipped release).'
        type: string
        default: ''
      source_ref:
        description: 'Re-draft: the release PR source commit/ref that ends the research range. Required with target_version.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    # Serialise drafts: two quick successive releases would race on the same
    # index page and branch namespace.
    concurrency:
      group: release-notes-draft
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read       # the agent only reads; the PR push uses RELEASE_TOKEN
      issues: read
      pull-requests: read
      id-token: write
    steps:
      # Manual target_version re-drafts land on the open release PR's prep
      # branch, exactly like the prepare-time run — a re-draft that opened
      # a standalone PR against the default branch would bypass the
      # release PR's review and its draft hold (template#421).  The prep
      # branch is discovered the same way the reservation check reads
      # reservations: the open knope/prepare/* PR whose stamped
      # pyproject.toml carries the target version.  No match is an error —
      # backfilling a SHIPPED release is tag mode's job.  Pure API, so it
      # runs before checkout; skipped in call mode (prep_branch given) and
      # tag mode (no target_version).
      - name: Discover the release PR for a manual re-draft
        id: discover
        if: ${{ inputs.target_version != '' && !inputs.prep_branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          found=""
          heads="$(gh pr list --repo "$REPO" --state open --limit 100 \
            --json headRefName,headRefOid \
            --jq '.[] | select(.headRefName | startswith("knope/prepare/")) | [.headRefName, .headRefOid] | @tsv')"
          if [ -n "$heads" ]; then
            while IFS="$(printf '\t')" read -r head oid; do
              [ -n "$head" ] || continue
              ver="$(gh api "repos/${REPO}/contents/pyproject.toml?ref=${head}" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null \
                | sed -n 's/^version = "\(.*\)"/\1/p' | head -1 || true)"
              if [ "$ver" = "${TARGET_VERSION#v}" ]; then
                found=1
                {
                  echo "prep_branch=${head}"
                  echo "expected_head=${oid}"
                } >> "$GITHUB_OUTPUT"
                echo "re-draft targets release PR branch ${head} at ${oid}"
                break
              fi
            done <<< "$heads"
          fi
          if [ -z "$found" ]; then
            echo "::error::no open release PR carries version ${TARGET_VERSION} — re-dispatch Release Prepare first, or use tag mode to backfill a shipped release"
            exit 1
          fi

      - name: Checkout the branch the draft lands on
        uses: actions/checkout@v7
        with:
          # Call mode: the release PR's prep branch — the draft is release
          # content and belongs in that PR's diff, and the tree there (base
          # plus knope's stamps) is exactly the state the page describes.
          # Dispatch mode: the default branch, where the accumulated pages
          # live.  Research is API-driven, but full depth supplies the tags
          # for the previous-stable computation and the tag-to-tag surface
          # diffs (import surface, env examples) the upgrade section
          # derives from.
          ref: ${{ inputs.prep_branch || steps.discover.outputs.prep_branch || github.event.repository.default_branch }}
          fetch-depth: 0
          # PAT, so the push below triggers CI on the release PR (call
          # mode) or on the standalone notes PR (dispatch mode) —
          # GITHUB_TOKEN pushes trigger no workflows.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Resolve release context
        id: ctx
        env:
          INPUT_TAG: ${{ inputs.tag }}
          TARGET_VERSION: ${{ inputs.target_version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -n "$TARGET_VERSION" ]; then
            # Prepare-time mode: the tag does not exist yet.  Key everything
            # on the target's stable version (an rc target drafts its
            # stable's minor page) and end the research range at the release
            # PR's source commit instead of a tag.
            [ -z "$TAG" ] \
              || { echo "::error::tag and target_version are mutually exclusive"; exit 1; }
            [ -n "$SOURCE_REF" ] \
              || { echo "::error::source_ref is required with target_version — pass the release PR's source commit"; exit 1; }
            stable="${TARGET_VERSION#v}"
            stable="${stable%%-*}"
            TAG="v${stable}"
            echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::'${TARGET_VERSION}' does not name a version — expected X.Y.Z or X.Y.Z-rc.N"; exit 1; }
            # Validate the range end EARLY — a typo must fail this cheap
            # step, not the hour-long agent job.  The checkout holds only
            # the default branch, so a release-branch source commit may need
            # fetching; a successful fetch is itself proof the ref exists on
            # origin.  Either way, resolve RANGE_END to a SHA: a fetched ref
            # lands only in FETCH_HEAD, so the agent job's local git
            # commands could not resolve the ref NAME later.
            if git rev-parse -q --verify "${SOURCE_REF}^{commit}" > /dev/null; then
              RANGE_END="$(git rev-parse "${SOURCE_REF}^{commit}")"
            elif git fetch -q origin "$SOURCE_REF"; then
              RANGE_END="$(git rev-parse FETCH_HEAD)"
            else
              echo "::error::source_ref '${SOURCE_REF}' is neither a known commit nor fetchable from origin"
              exit 1
            fi
          else
            if [ -z "$TAG" ]; then
              TAG=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            fi
            echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "::error::'${TAG}' is not a stable vX.Y.Z tag — notes pages are per stable minor; rcs have no page"; exit 1; }
            git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null \
              || { echo "::error::tag ${TAG} not found"; exit 1; }
            RANGE_END="$TAG"
          fi
          ver="${TAG#v}"
          minor="${ver%.*}"
          # Highest stable tag strictly below this release (same series-aware
          # idiom as release.yml's body step); empty on a first release.
          prev=$(
            { git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | grep -Fvx "$TAG"; echo "$TAG"; } \
              | sort -V | awk -v t="$TAG" '$0 == t { print p; exit } { p = $0 }'
          )
          page="docs/releases/${minor}.md"
          # Mode: patch-append only when the page does NOT yet carry this
          # release's section.  With prepare-time drafting the page can
          # already cover the target before its tag exists — an X.Y.0 page
          # drafted at prepare time (template#406), or a patch section
          # written by an earlier rc of the same target (rc.1 → rc.2 →
          # stable all normalise to the same vX.Y.Z).  Appending again
          # would duplicate the section and its summary markers, so any
          # page that already carries the target's RELEASE-SUMMARY marker
          # is re-drafted in place instead (template#421).
          mode=new
          if [ -f "$page" ]; then
            if grep -qF "RELEASE-SUMMARY ${TAG} START" "$page"; then
              mode=redraft
            elif [ "${ver##*.}" -gt 0 ]; then
              mode=patch
            else
              mode=redraft
            fi
          fi
          {
            echo "tag=$TAG"
            echo "version=$ver"
            echo "minor=$minor"
            echo "prev=$prev"
            echo "range_end=$RANGE_END"
            echo "page=$page"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        # Gives the agent a working `uv run mkdocs build --strict` check.
        run: uv sync --no-default-groups --group docs --frozen

      - name: Install Vale and sync style packs
        # The Vale CLI pin lives in ci.yml's vale job (kept in lockstep with
        # pre-commit by the template CI); extract it rather than adding a
        # third pin surface here.  The synced packs include ai-tells, the
        # LLM-prose detector that is this pipeline's prose gate.
        run: |
          set -euo pipefail
          VER=$(awk '/^  vale:/{f=1} f && /^[[:space:]]+version:/{print; exit}' \
              .github/workflows/ci.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          [ -n "$VER" ] || { echo "::error::vale version pin not found in ci.yml"; exit 1; }
          mkdir -p "$RUNNER_TEMP/valebin"
          TARBALL="vale_${VER}_Linux_64-bit.tar.gz"
          BASE="https://github.com/vale-cli/vale/releases/download/v${VER}"
          curl -sSfL -o "$RUNNER_TEMP/$TARBALL" "$BASE/$TARBALL" \
            || { echo "::error::could not download $BASE/$TARBALL"; exit 1; }
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$BASE/vale_${VER}_checksums.txt" \
            || { echo "::error::could not download the vale $VER checksums file"; exit 1; }
          ( cd "$RUNNER_TEMP" && grep " $TARBALL\$" checksums.txt | sha256sum -c - ) \
            || { echo "::error::vale $VER tarball failed checksum verification"; exit 1; }
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP/valebin" vale
          echo "$RUNNER_TEMP/valebin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/valebin/vale" sync

      # The research contract requires parallel per-theme subagents (Task).
      # Same pin + rationale as claude-code-review.yml: on Claude Code
      # >= 2.1.198 claude-code-action drops background subagents before they
      # finish (claude-code-action#1499), so the fan-out would silently lose
      # its research. Remove once #1499 is fixed upstream.
      - name: Install pinned Claude Code (2.1.197, pre-background-subagents)
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- 2.1.197
          BIN="$HOME/.local/bin/claude"
          test -x "$BIN"
          "$BIN" --version
          echo "CLAUDE_BIN=$BIN" >> "$GITHUB_ENV"

      - name: Draft the notes page
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ env.CLAUDE_BIN }}
          prompt: |
            Load the writing-release-notes skill (.claude/skills/writing-release-notes/SKILL.md) and follow it end to end for this stable release:

            - repository: ${{ github.repository }}
            - tag: ${{ steps.ctx.outputs.tag }} (version ${{ steps.ctx.outputs.version }}, minor series ${{ steps.ctx.outputs.minor }})
            - previous stable: ${{ steps.ctx.outputs.prev }} (empty means first release)
            - research range end (RANGE_END): ${{ steps.ctx.outputs.range_end }} (equals the tag after a release; at prepare time it is the open release PR's source commit — the tag does not exist yet)
            - page: ${{ steps.ctx.outputs.page }}
            - mode: ${{ steps.ctx.outputs.mode }} (new = write the whole page and add it to docs/releases/index.md; patch = append one dated section inside the patch sentinels; redraft = the minor's page already exists — e.g. drafted at prepare time — so update/extend it in place and never append a duplicate section for this release)

            The vale binary (packs synced) and `uv run mkdocs build --strict` are available for the skill's quality gates. Write your proposed pull-request body to .release-notes-pr-body.md at the repository root (used only when this run opens a standalone notes PR; ignored when the draft lands on a release PR's branch). Do not commit, push, or open a PR yourself — the workflow's next step lands your working tree mechanically.
          # No progress-tracking input: the action supports it only on
          # PR/issue events, and this workflow only ever runs on
          # workflow_dispatch / workflow_call — passing it is a hard error
          # before the agent starts (template#421, first live drafting run).
          display_report: true
          include_fix_links: false
          # Read-only GitHub research (MCP read tools + gh api), Task for the
          # per-theme fan-out, Skill to load the contract, vale + mkdocs for
          # the quality loop, and read-only git for tag-to-tag surface diffs.
          # Edit/Write stay available from the action's defaults; the job's
          # `contents: read` keeps the agent from pushing anything.
          claude_args: |
            --allowedTools "Skill,Task,mcp__github__get_*,mcp__github__list_*,mcp__github__search_*,Bash(gh api *),Bash(vale *),Bash(uv run mkdocs *),Bash(git tag *),Bash(git show *),Bash(git diff *),Bash(git log *)"

      - name: Land the drafted page
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.ctx.outputs.tag }}
          DEFAULT: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          PREP_BRANCH: ${{ inputs.prep_branch || steps.discover.outputs.prep_branch }}
          EXPECTED_HEAD: ${{ inputs.expected_head || steps.discover.outputs.expected_head }}
          PAGE: ${{ steps.ctx.outputs.page }}
          RANGE_END: ${{ steps.ctx.outputs.range_end }}
        run: |
          set -euo pipefail
          # Only the notes surface is ever committed: the release pages and
          # any vocabulary the Vale loop legitimately added.
          ACCEPT=".vale/styles/config/vocabularies/Base/accept.txt"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$PREP_BRANCH" ]; then
            # Call mode: the page is release content — commit it onto the
            # release PR's prep branch so the release PR's diff carries it
            # and the merge puts it in the tagged tree (template#419).
            # First, UNCONDITIONALLY: the target page must exist and carry
            # this run's notes-range-end watermark.  An agent run that
            # edited only vocabulary, the index, or another page — or
            # nothing at all (an honest failure leaves no edits) — has
            # still failed THIS release's refresh, and accepting it would
            # silently ship stale notes.  Re-run this job, or re-dispatch
            # Release Prepare with skip_notes to consciously release
            # without a refresh.
            if ! { [ -f "$PAGE" ] && grep -qF "notes-range-end: ${RANGE_END}" "$PAGE"; }; then
              echo "::error::${PAGE} is missing or its notes-range-end watermark does not match ${RANGE_END} — the draft did not refresh this release's page. Re-run this job, or re-dispatch Release Prepare with skip_notes=true to release without a notes refresh"
              exit 1
            fi
            if ! git status --porcelain -- docs/releases "$ACCEPT" | grep -q .; then
              # Watermark verified above, tree untouched: the accepted
              # draft already covers this range (normal at a quiet
              # promotion).
              echo "page ${PAGE} already covers this range (watermark at ${RANGE_END}) — nothing to commit; the release PR ships the accepted draft from its base"
              accepted_head="$EXPECTED_HEAD"
            else
              git add docs/releases "$ACCEPT"
              git commit -m "docs(releases): notes for ${TAG}"
              # Lease on the stamp head this draft was cut against: a
              # Release Prepare re-dispatch force-recreates the prep
              # branch, and a stale draft must never clobber the newer
              # prepare — the lease fails this push loudly instead; the
              # newer dispatch's own draft-notes job owns the branch.
              git push --force-with-lease="${PREP_BRANCH}:${EXPECTED_HEAD}" \
                origin "HEAD:${PREP_BRANCH}"
              accepted_head="$(git rev-parse HEAD)"
            fi
            # The notes are in (or confirmed current) — lift the draft hold
            # release-prepare.yml placed on the release PR, making it
            # mergeable only now that it is complete (template#421).  The
            # lift is guarded on the PR still pointing at the head THIS run
            # accepted: a newer Release Prepare may have force-recreated
            # the branch (and restored the hold) since — an older notes
            # run must never mark that refreshed, notes-less head ready.
            pr="$(gh pr list --state open --head "$PREP_BRANCH" \
              --json number --jq '.[0].number' 2>/dev/null || true)"
            if [ -z "$pr" ]; then
              echo "::warning::no open release PR found for ${PREP_BRANCH} — nothing to mark ready"
              exit 0
            fi
            current_head="$(gh pr view "$pr" --json headRefOid --jq .headRefOid 2>/dev/null || true)"
            if [ "$current_head" != "$accepted_head" ]; then
              echo "::warning::release PR #${pr} head ${current_head} is not the head this run accepted (${accepted_head}) — a newer prepare owns the PR; leaving its draft hold in place"
              exit 0
            fi
            gh pr ready "$pr" || echo "::warning::could not mark release PR #${pr} ready — lift the draft hold by hand"
            exit 0
          fi
          # Dispatch mode (backfill / re-draft): a standalone notes PR
          # against the default branch.  An agent run that changed nothing
          # (honest failure) opens no PR.
          if ! git status --porcelain -- docs/releases "$ACCEPT" | grep -q .; then
            echo "no notes changes produced — skipping PR"
            exit 0
          fi
          BODY=.release-notes-pr-body.md
          if [ ! -f "$BODY" ]; then
            {
              echo "Agent-drafted release notes for ${TAG} (the drafting run left no PR body; review the page against its inline evidence links)."
              echo
              echo "Refs: https://github.com/${REPO}/releases/tag/${TAG}"
            } > "$BODY"
          fi
          BRANCH="release-notes/${TAG}"
          git checkout -B "$BRANCH"
          git add docs/releases "$ACCEPT"
          git commit -m "docs(releases): release notes for ${TAG}"
          # Force: a re-dispatch for the same tag replaces the previous draft.
          git push --force origin "HEAD:${BRANCH}"
          gh pr create --base "$DEFAULT" --head "$BRANCH" \
            --title "docs(releases): release notes for ${TAG}" \
            --body-file "$BODY" \
            || echo "PR for ${BRANCH} already exists — the force-push updated it"
