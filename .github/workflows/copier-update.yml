name: Copier Update

# Weekly automated `copier update` against this project's template source.
# If the template has moved since `.copier-answers.yml:_commit`, opens (or
# refreshes) a PR on branch `copier/update` so CI can validate the diff and
# an operator can review/merge.
#
# Deterministic by design: the run applies the update, commits any conflict
# markers for the operator, and composes the PR body from facts alone — the
# ref delta, the template's release notes and UPGRADING.md sections for the
# jump, the conflict list, and the diff stat.  Automated runs step at most
# ONE major at a time: a multi-major jump becomes a sequence of per-major
# update PRs (merge one, the next scheduled run opens the next), so each PR
# carries one major's migration notes and CI validates each stage.  An
# explicit `vcs_ref` dispatch input jumps straight to the asked ref.
#
# No agent analysis: an earlier
# incarnation ran three claude-code agent steps (conflict auto-resolution,
# changelog triage, excluded-file triage) whose wall-clock cost dwarfed the
# update itself and whose conflict resolutions drifted toward preserving
# local deviations from the template.  The template is the one upstream
# source that keeps every downstream repo aligned, so the PR body now states
# the resolution policy (template wins outside downstream-owned regions) and
# leaves resolution to the operator — or to an interactive Claude session on
# the branch, where the operator can supervise it.
#
# Uses the RELEASE_TOKEN PAT (not GITHUB_TOKEN) so the opened PR triggers
# downstream workflows — GITHUB_TOKEN-authored PRs are muted by design.

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      vcs_ref:
        description: "Template ref to update to (default: latest tag from .copier-answers.yml source)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Choose target ref (one major per run)
        id: target
        env:
          INPUT_VCS_REF: ${{ inputs.vcs_ref }}
        run: |
          set -euo pipefail
          # Capture the pre-update `_commit` BEFORE copier rewrites
          # `.copier-answers.yml` with the new ref — the PR body uses it to
          # render the prev_ref→ref delta, a compare link, and the UPGRADING
          # section range.  `|| true` so a missing/corrupt answers file
          # doesn't abort before the update (the post-update meta step
          # re-parses and hard-fails if needed).
          prev_ref=$(awk '/^_commit:[[:space:]]/ {print $2; exit}' .copier-answers.yml || true)
          echo "prev_ref=${prev_ref}" >> "$GITHUB_OUTPUT"

          # Derive the template source repo from `_src_path` in .copier-answers.yml
          # rather than synthesising from `{{ github_org }}` — `github_org` is the
          # *consumer's* org (for Docker paths, etc.), not the template source's.
          # Normalize the common forms copier may have stored ({gh:,https://github.com/,
          # git@github.com:}org/repo[.git]) down to `org/repo`; local paths or anything
          # else unrecognised becomes empty and the later steps skip the release-notes,
          # upgrade-notes, compare-link, and staging logic gracefully.
          src_path=$(awk '/^_src_path:[[:space:]]/ {print $2; exit}' .copier-answers.yml || true)
          template_repo=$(printf '%s' "${src_path}" \
            | sed -E 's|^gh:||; s|^https?://github\.com/||; s|^git@github\.com:||; s|\.git$||; s|/+$||')
          if ! printf '%s' "${template_repo}" | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            template_repo=""
          fi
          echo "template_repo=${template_repo}" >> "$GITHUB_OUTPUT"

          # An explicit dispatch input wins outright — the operator asked
          # for that exact ref, staging does not apply.
          vcs_ref="${INPUT_VCS_REF}"
          latest_tag=""
          if [ -z "${vcs_ref}" ] && [ -n "${template_repo}" ] && [ -n "${prev_ref}" ]; then
            # Stage automated runs one major at a time: list the template's
            # tags and let pick-target choose the newest stable tag of the
            # next major above the current one (empty output = no majors
            # ahead = copier's latest-tag default is already right).
            # Best-effort: an ls-remote failure (private template, network)
            # falls through to the default, same as before staging existed.
            if git ls-remote --tags --refs \
                "https://github.com/${template_repo}.git" 2>/dev/null \
                | awk -F/ '{print $NF}' > /tmp/template-tags.txt; then
              vcs_ref=$(python3 scripts/copier_update_notes.py pick-target \
                --previous "${prev_ref}" --tags /tmp/template-tags.txt)
              # Newest stable tag overall — the PR body compares it against
              # the chosen target to flag a staged (not-yet-latest) update.
              latest_tag=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' /tmp/template-tags.txt \
                | sort -V | tail -1 || true)
            else
              echo "::notice::could not list template tags; falling back to copier's latest-tag default"
            fi
          fi
          echo "vcs_ref=${vcs_ref}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Run copier update
        id: copier
        env:
          VCS_REF: ${{ steps.target.outputs.vcs_ref }}
        run: |
          set -euo pipefail
          # `--conflict=inline` runs a real 3-way merge and writes standard
          # `<<<<<<< before updating / ||||||| last update / ======= / >>>>>>> after updating`
          # markers when local edits collide with template changes.  The
          # alternative `--conflict=rej` is dangerously misleading: it
          # blindly renders the new template content into the working file
          # and only writes a `.rej` sidecar describing what was lost — so
          # divergent local lines (license overrides, version bumps, etc.)
          # silently disappear.
          args=(update --trust --defaults --skip-answered --conflict=inline)
          if [ -n "${VCS_REF}" ]; then
            args+=(--vcs-ref "${VCS_REF}")
          fi
          uvx copier "${args[@]}"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read template ref + collect conflict files
        if: steps.changes.outputs.changed == 'true'
        id: meta
        run: |
          set -euo pipefail
          # Parse `_commit:` from .copier-answers.yml without depending on
          # PyYAML being present in the runner's system Python.  copier's
          # to_nice_yaml output puts the key on its own line in canonical form.
          ref=$(awk '/^_commit:[[:space:]]/ {print $2; exit}' .copier-answers.yml)
          if [ -z "${ref}" ]; then
            echo "::error::could not read _commit from .copier-answers.yml"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          # `--conflict=inline` writes standard `<<<<<<< before updating`
          # markers (not `.rej` sidecars).  Collect files that contain at
          # least one conflict marker; skip binary files with `git grep -I`.
          # `|| true` swallows git grep's exit code 1 on no-match so the
          # happy path (zero conflicts) doesn't trip `set -euo pipefail`.
          # We emit the file *list* (not just the count) so the PR body can
          # tell the reviewer exactly which files need manual resolution.
          conflict_files=$( { git grep -lI '^<<<<<<< before updating$' || true; } )
          if [ -n "${conflict_files}" ]; then
            conflict_count=$(printf '%s\n' "${conflict_files}" | wc -l | tr -d ' ')
          else
            conflict_count=0
          fi
          echo "conflict_count=${conflict_count}" >> "$GITHUB_OUTPUT"
          # Multiline `conflict_files` needs the heredoc form of $GITHUB_OUTPUT.
          # The `CONFLICT_FILES_EOF` delimiter is safe because git-tracked file paths
          # can't contain newlines, let alone a line that matches that literal string.
          {
            echo "conflict_files<<CONFLICT_FILES_EOF"
            printf '%s\n' "${conflict_files}"
            echo "CONFLICT_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Collect UPGRADING.md sections for the jump
        # The template's UPGRADING.md is `_exclude`d (never rendered here),
        # so fetch it from the template source at the target ref and let
        # scripts/copier_update_notes.py select the sections between the
        # previous ref's minor and the target's.  Best-effort: a private
        # template source, a pre-UPGRADING ref, or an unparseable previous
        # ref all degrade to an empty file, and the PR body links the full
        # file instead.  (The fetch is unauthenticated-equivalent: the
        # RELEASE_TOKEN PAT is scoped to THIS repo, so a template repo is
        # only readable when public — the same assumption the release-notes
        # fetch below has always made.)  `continue-on-error` because the
        # embed is an enrichment: if this step fails, the body step sees an
        # empty/absent notes file and falls back to linking the full file.
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REF: ${{ steps.meta.outputs.ref }}
          PREV_REF: ${{ steps.target.outputs.prev_ref }}
          TEMPLATE_REPO: ${{ steps.target.outputs.template_repo }}
        run: |
          set -euo pipefail
          : > /tmp/upgrading-notes.md
          if [ -z "${TEMPLATE_REPO}" ] || [ "${PREV_REF}" = "${REF}" ]; then
            exit 0
          fi
          if ! gh api -H "Accept: application/vnd.github.raw" \
              "repos/${TEMPLATE_REPO}/contents/UPGRADING.md?ref=${REF}" \
              > /tmp/upgrading.md 2>/dev/null; then
            echo "::notice::could not fetch UPGRADING.md at ${REF}; the PR body links the file instead"
            exit 0
          fi
          # Since the per-minor split, UPGRADING.md is an index whose
          # released sections are pointer rows; the full steps live in
          # upgrading/vX.Y.md files. Fetch the jump's files (the list comes
          # from the index, so a skipped minor number is never requested)
          # and let `notes` embed each in full. A file that fails to fetch
          # falls back to its index pointer row — a working link, never a
          # silently empty embed. Against a pre-split target ref the index
          # still carries the full sections and the list is empty.
          mkdir -p /tmp/upgrading-sections
          python3 scripts/copier_update_notes.py section-files \
            --upgrading /tmp/upgrading.md \
            --previous "${PREV_REF}" \
            --target "${REF}" > /tmp/upgrading-files.txt
          while IFS= read -r section_path; do
            [ -n "${section_path}" ] || continue
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${TEMPLATE_REPO}/contents/${section_path}?ref=${REF}" \
              > "/tmp/upgrading-sections/$(basename "${section_path}")" 2>/dev/null \
              || rm -f "/tmp/upgrading-sections/$(basename "${section_path}")"
          done < /tmp/upgrading-files.txt
          python3 scripts/copier_update_notes.py notes \
            --upgrading /tmp/upgrading.md \
            --previous "${PREV_REF}" \
            --target "${REF}" \
            --max-chars 30000 \
            --sections-dir /tmp/upgrading-sections \
            --output /tmp/upgrading-notes.md

      - name: Ensure PR labels exist
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # `gh pr create --label foo` fails if the label doesn't exist,
          # so ensure both labels are present first.  `|| true` keeps the
          # step idempotent across repeat runs.
          gh label create copier \
            --color C5DEF5 \
            --description "Automated copier template sync" \
            2>/dev/null || true
          gh label create dependencies \
            --color 0075CA \
            --description "Pull requests that update a dependency file" \
            2>/dev/null || true

      - name: Commit and push to copier/update branch
        if: steps.changes.outputs.changed == 'true'
        env:
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          set -euo pipefail
          branch="copier/update"
          # `git add -A` runs BEFORE `git checkout -B` because copier's
          # `--conflict=inline` mode leaves conflict-marker files in the
          # index as `UU` (unmerged).  `git checkout -B` refuses to switch
          # branches with unresolved merge entries; staging them first
          # clears the unmerged state and lets the branch creation proceed.
          # The conflict markers themselves land in the commit for human
          # resolution in the PR.
          git add -A
          git checkout -B "${branch}"
          git commit -m "chore(copier): update to ${REF}" \
            -m "Automated \`copier update\` run — review the diff and merge if CI is green."
          git push --force-with-lease origin "${branch}"

      - name: Compute diff summary
        if: steps.changes.outputs.changed == 'true'
        id: diff
        run: |
          set -euo pipefail
          # Diff against main rather than HEAD~1: `copier/update` carries a
          # single fresh commit per run today, but the branch survives
          # between weekly refreshes and diffing the base keeps the stat
          # honest regardless of how the branch history evolves.
          git fetch origin main --depth=50
          diff_count=$(git diff --name-only origin/main HEAD | wc -l | tr -d ' ')
          echo "diff_count=${diff_count}" >> "$GITHUB_OUTPUT"
          {
            echo "diff_stat<<DIFF_STAT_EOF"
            git diff --stat origin/main HEAD
            echo "DIFF_STAT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build PR body content
        id: build-body
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REF: ${{ steps.meta.outputs.ref }}
          PREV_REF: ${{ steps.target.outputs.prev_ref }}
          TEMPLATE_REPO: ${{ steps.target.outputs.template_repo }}
          CONFLICT_COUNT: ${{ steps.meta.outputs.conflict_count }}
          CONFLICT_FILES: ${{ steps.meta.outputs.conflict_files }}
          DIFF_COUNT: ${{ steps.diff.outputs.diff_count }}
          DIFF_STAT: ${{ steps.diff.outputs.diff_stat }}
          LATEST_TAG: ${{ steps.target.outputs.latest_tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr

          # Fetch release notes for the target ref.  Empty when the release
          # isn't cut yet (e.g. a manual `--vcs-ref` run targeting an unreleased
          # sha) or when `_src_path` doesn't resolve to a GitHub repo (local
          # template dev) — in which case the notes section is skipped.
          release_notes=""
          if [ -n "${TEMPLATE_REPO}" ]; then
            release_notes=$(gh release view "${REF}" \
              --repo "${TEMPLATE_REPO}" \
              --json body --jq .body 2>/dev/null || true)
          fi

          # Build the PR body piece-by-piece with $'\n' separators — a single
          # multi-line bash string would break the enclosing YAML block scalar
          # because the continuation lines would need to stay at column 11.

          # Heading: render prev_ref→ref and a compare link when we have a
          # previous ref that differs from the new one AND a resolvable
          # template repo.  Otherwise fall back to a plain "update to REF".
          if [ -n "${PREV_REF}" ] && [ "${PREV_REF}" != "${REF}" ]; then
            body="## Template update: \`${PREV_REF}\` → \`${REF}\`"
            if [ -n "${TEMPLATE_REPO}" ]; then
              body+=$'\n\n'"[Compare on GitHub](https://github.com/${TEMPLATE_REPO}/compare/${PREV_REF}...${REF})"
            fi
          else
            body="## Template update to \`${REF}\`"
          fi

          # Staged update: automated runs step one major at a time, so when
          # the chosen target is not the template's newest stable tag, say
          # so — the operator should expect the next stage, not wonder why
          # the update stopped short.
          if [ -n "${LATEST_TAG}" ] && [ "${REF}" != "${LATEST_TAG}" ]; then
            body+=$'\n\n'"> **Staged update:** automated runs advance one major at a time. The template's newest stable release is \`${LATEST_TAG}\`; merge this PR and the next scheduled run opens the next stage (or dispatch the workflow with \`vcs_ref\` to jump directly)."
          fi

          # Release notes in a collapsed block so the PR body stays scannable.
          if [ -n "${release_notes}" ]; then
            body+=$'\n\n'"<details><summary>Release notes (${REF})</summary>"
            body+=$'\n\n'"${release_notes}"
            body+=$'\n\n'"</details>"
          fi

          # UPGRADING.md sections for the jump — the template-maintained
          # record of the manual work `copier update` cannot do.  Collapsed;
          # the full file at the target ref is always linked so the embed can
          # degrade (fetch failure, first update, oversized range) without
          # losing the pointer.
          if [ -n "${TEMPLATE_REPO}" ]; then
            upgrading_url="https://github.com/${TEMPLATE_REPO}/blob/${REF}/UPGRADING.md"
            if [ -s /tmp/upgrading-notes.md ]; then
              body+=$'\n\n'"### Upgrade notes (manual steps)"
              body+=$'\n\n'"<details><summary>UPGRADING.md sections for this jump</summary>"
              body+=$'\n\n'"$(cat /tmp/upgrading-notes.md)"
              body+=$'\n\n'"</details>"
              body+=$'\n\n'"Full guide: [\`UPGRADING.md\` at ${REF}](${upgrading_url})."
            else
              body+=$'\n\n'"### Upgrade notes (manual steps)"
              body+=$'\n\n'"Read [\`UPGRADING.md\` at ${REF}](${upgrading_url}) — every applicable section between the previous ref and the target."
            fi
          fi

          # Resolution policy — the template is the alignment mechanism for
          # the whole fleet, so the default in every conflict is the template
          # side; local deviations outside the downstream-owned regions are
          # drift, not house style.
          body+=$'\n\n'"### Resolution policy"
          body+=$'\n\n'"This project tracks the template: the template is the single upstream source that keeps every downstream repo aligned. Resolve the diff — and any conflict markers — by **taking the template side**, except in downstream-owned regions:"
          body+=$'\n\n'"- content inside \`DOMAIN-*\` / \`PROJECT-*\` / \`CONFIG-*\` sentinel blocks;"
          body+=$'\n'"- files listed under \`_skip_if_exists\` in the template's \`copier.yml\`."
          # A skip-listed file is absent from this diff entirely, and the line
          # above tells the reviewer to leave it alone — correct for conflict
          # resolution, and the reason a template *correction* to one of them
          # can go unadopted for releases with nothing saying so. Point at the
          # check rather than leaving the omission to be inferred.
          # No `${upgrading_url}` here: it is set inside the TEMPLATE_REPO
          # branch above, so it may be unset at this point and would render an
          # empty link.
          body+=$'\n\n'"A \`_skip_if_exists\` file is not in this diff at all — Copier never re-renders one that already exists. That also means a template *correction* to one never arrives on its own. See \"Before every upgrade\" in the template's \`UPGRADING.md\` for which of them the template still authors content for, and how to diff them against the target."
          body+=$'\n\n'"\"House style\", \"we already had this\", or \"otherwise something would be missing\" are not reasons to keep local drift. If the template's side seems wrong or incomplete, that is a template bug or a missing sentinel seam — file it upstream (see \`CONTRIBUTING.md\` routing) and fix it there, so the whole fleet gets the correction."

          # Conflicts — list the files (not just a count), and call out that
          # the markers are *committed to the branch*, not sidecar .rej files.
          if [ "${CONFLICT_COUNT}" -gt 0 ]; then
            body+=$'\n\n'"### ⚠️ ${CONFLICT_COUNT} file(s) with unresolved conflict markers"
            body+=$'\n\n'"The \`<<<<<<< before updating\` markers **are committed to this branch** — resolve them before merging:"
            body+=$'\n'
            while IFS= read -r f; do
              [ -n "${f}" ] && body+=$'\n'"- \`${f}\`"
            done <<< "${CONFLICT_FILES}"
          fi

          # Seeded-file change report — written by the template's
          # report_seeded_changes.py migration at the end of the update (#519).
          # After the conflict list (which must survive the tail truncation
          # below) and bounded: the committed file is the full record.
          if [ -s .copier-seeded-changes.md ]; then
            body+=$'\n\n'"### Seeded files the template changed"
            body+=$'\n\n'"Files under \`_skip_if_exists\` are never re-rendered; \`.copier-seeded-changes.md\` on this branch holds what the template changed in them."
            body+=$'\n\n'"<details><summary>.copier-seeded-changes.md</summary>"
            body+=$'\n\n'"$(head -c 15000 .copier-seeded-changes.md)"
            if [ "$(wc -c < .copier-seeded-changes.md)" -gt 15000 ]; then
              # A byte cut can land inside one of the report's four-backtick
              # diff fences; an unclosed fence would swallow the rest of the
              # body.  Always close one: a stray fence line is inert.
              body+=$'\n''````'
              body+=$'\n\n'"> **Truncated at 15000 characters** — read the committed file for the rest."
            fi
            body+=$'\n\n'"</details>"
          fi

          # Diff stat — always collapsed; even a handful of files is noisy.
          body+=$'\n\n'"<details><summary>Files changed (${DIFF_COUNT})</summary>"
          body+=$'\n\n''```'
          body+=$'\n'"${DIFF_STAT}"
          body+=$'\n''```'
          body+=$'\n\n'"</details>"

          body+=$'\n\n'"---"
          body+=$'\n\n'"> **Note:** \`--skip-answered\` was passed, so any **new** template variables introduced since the last update were silently filled with their copier defaults. Skim \`.copier-answers.yml\` for unexpected new keys."

          printf '%s' "${body}" > /tmp/pr/body.md

          # GitHub rejects PR bodies over 65536 characters.  The embedded
          # sections are individually bounded (upgrade notes at 30000 via
          # --max-chars, release notes one release deep), but belt-and-braces:
          # a hard truncation with a visible marker beats a failed `gh pr
          # create` after the branch already pushed.
          if [ "$(wc -c < /tmp/pr/body.md)" -gt 60000 ]; then
            head -c 60000 /tmp/pr/body.md > /tmp/pr/body.trunc
            printf '\n\n---\n\n> **Truncated:** this body exceeded the PR size limit — read the linked release notes and UPGRADING.md directly.' >> /tmp/pr/body.trunc
            mv /tmp/pr/body.trunc /tmp/pr/body.md
          fi

      - name: Open or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          set -euo pipefail
          branch="copier/update"
          title="chore(copier): update to ${REF}"

          if gh pr view "${branch}" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            gh pr edit "${branch}" \
              --title "${title}" \
              --body-file /tmp/pr/body.md \
              --add-label copier \
              --add-label dependencies
          else
            gh pr create \
              --base main \
              --head "${branch}" \
              --title "${title}" \
              --body-file /tmp/pr/body.md \
              --label copier \
              --label dependencies
          fi
